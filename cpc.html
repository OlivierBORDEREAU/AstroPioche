<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>ASTRO PIOCHE - Amstrad CPC</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:stretch;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #screen{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #out{display:none}
  /* ----- Commandes tactiles facon joystick CX40 (cachees hors tactile) ----- */
  .ctl{display:none}
  html.touch .ctl{display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  html.touch #ctlrow{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px}
  #ctlrow{display:contents}
  .grp{display:flex;gap:12px;padding:8px;border-radius:16px;background:#151515;box-shadow:inset 0 0 0 3px #262626,0 0 0 2px #0a0a0a;opacity:.9}
  .btn{position:relative;width:76px;height:76px;border-radius:12px;background:#2b2b2b;box-shadow:inset 0 0 0 2px #3a3a3a,0 4px 0 #0c0c0c;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .btn.on{transform:translateY(3px);box-shadow:inset 0 0 0 2px #4a4a4a,0 1px 0 #0c0c0c;background:#353535}
  .arrow{width:0;height:0;border:16px solid transparent}
  #bl .arrow{border-right:24px solid #c46a2c;border-left-width:0;margin-left:-6px}
  #br .arrow{border-left:24px solid #c46a2c;border-right-width:0;margin-right:-6px}
  .btn.on .arrow{filter:brightness(1.35)}
  .lbl{font:bold 9px/1 monospace;letter-spacing:1px;color:#c46a2c}
  #bfire .lbl{color:#e6a39b}
  .pick{width:30px;height:30px;image-rendering:pixelated}
  #bfire{background:transparent;box-shadow:none}
  #bfire .cap{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#e2483a,#a8160f 62%,#6e0b06);
    box-shadow:0 5px 0 #4a0603,inset 0 -3px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
  #bfire.on{transform:none;background:transparent;box-shadow:none}
  #bfire.on .cap{transform:translateY(4px);box-shadow:0 1px 0 #4a0603,inset 0 -3px 6px rgba(0,0,0,.4);filter:brightness(1.2)}
  @media (orientation:landscape){
    html.touch body{flex-direction:row;align-items:center}
    html.touch #ctlrow{display:contents}
    html.touch #padwrap{order:0;padding:0 8px 0 10px} html.touch #screen{order:1;align-self:stretch} html.touch #firewrap{order:2;padding:0 10px 0 8px}
  }
</style>
</head>
<body>
<div id="screen"><canvas id="c"></canvas></div>
<div id="ctlrow">
  <div id="padwrap" class="ctl"><div id="lgrp" class="grp"><div id="bl" class="btn" aria-label="gauche"><div class="arrow"></div></div><div id="br" class="btn" aria-label="droite"><div class="arrow"></div></div></div></div>
  <div id="firewrap" class="ctl"><div id="rgrp" class="grp"><div id="bdig" class="btn" aria-label="creuser"><svg class="pick" viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="#9a9a9a" d="M1 2h2v1h1v1h1v1h1V4h1V3h1V2h-1V1H4v1H1z"/><path fill="#c46a2c" d="M5 5h1v1h1v1h1v1h1v1H8V8H7V7H6V6H5z"/></svg><span class="lbl">CREUSER</span></div><div id="bfire" class="btn" aria-label="feu"><div class="cap"><span class="lbl">FEU</span></div></div></div></div>
</div>

// ------------------------------------------------------------------ hardware constants
const W = 160, H = 200, BL = 16, BT = 36, TW = W + 2 * BL, TH = H + 2 * BT;
const HZ = 50, STEP = 1 / HZ;
const HWRGB = ['000000','000080','0000FF','800000','800080','8000FF','FF0000','FF0080','FF00FF',
               '008000','008080','0080FF','808000','808080','8080FF','FF8000','FF8080','FF80FF',
               '00FF00','00FF80','00FFFF','80FF00','80FF80','80FFFF','FFFF00','FFFF80','FFFFFF'];
const HW32 = HWRGB.map(h => { const v = parseInt(h, 16); return (255 << 24) | ((v & 255) << 16) | (((v >> 8) & 255) << 8) | (v >> 16); });
const HWC = HWRGB.map(h => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]);

// ------------------------------------------------------------------ pens (roles follow assets/palette.json)
const T = 0, K = 1, SKYA = 2, SKYB = 3, BB = 4, MV = 5, PC = 6, BW = 7, GR = 8, DR = 9, BR = 10, OR = 11, BY = 12, OL = 13, PY = 14, BM = 15;
let INKS = [0, 0, 1, 2, 2, 5, 23, 26, 13, 3, 6, 15, 24, 12, 25, 8];   // firmware ink per pen
let BORDER = 1;
let RASTER_BANDS = [   // default = OldGraphics' split table
  { y0: 0, y1: 15, inks: { 2: 0, 3: 0 } }, { y0: 16, y1: 55, inks: { 2: 1, 3: 2 } }, { y0: 56, y1: 95, inks: { 2: 1, 3: 5 } },
  { y0: 96, y1: 127, inks: { 2: 4, 3: 1 } }, { y0: 128, y1: 149, inks: { 2: 4, 3: 0 } }, { y0: 150, y1: 199, inks: { 2: 0, 3: 0 } }];
let LINE_INKS = null;   // per-line firmware ink for each pen, built from bands (+ title rainbow)

// ------------------------------------------------------------------ canvas / framebuffer
// image native dans un canvas hors écran, recopiée à l'échelle entière dans le canvas visible (voir fit/upscale)
const cv = document.getElementById('c'), octx = cv.getContext('2d');
const nat = document.createElement('canvas'), ctx = nat.getContext('2d');
nat.width = TW; nat.height = TH;
let SX = 1, SY = 1, OX = 0, OY = 0;
const IMG = ctx.createImageData(TW, TH), OUT32 = new Uint32Array(IMG.data.buffer);
// Detection tactile (avant fit pour que la mise en page tienne compte des commandes)
// Page unique tactile + clavier : commandes tactiles si pointeur grossier (téléphone/tablette) ou dès le premier appui
const IS_TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
if (IS_TOUCH) document.documentElement.classList.add('touch');
const SRC_W = TW, SRC_H = TH, PAR = 1.84, PAR_MIN = 1.75, PAR_MAX = 2;  // CPC mode 0 + bordure : 192x272, pixels ~1,84:1 à 2:1
function fit() {
  // Échelles ENTIÈRES en pixels physiques (devicePixelRatio compris) : chaque ligne et chaque colonne
  // source couvre exactement le même nombre de pixels écran -> pixels nets, sans lignes doublées au hasard.
  // On prend le plus grand couple (sx, sy) qui tient, avec un rapport sx/sy proche du PAR de la machine.
  const sc = document.getElementById('screen'), r = sc.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const AW = Math.floor(Math.max(1, r.width) * dpr + 1e-6), AH = Math.floor(Math.max(1, r.height) * dpr + 1e-6);
  let best = null;
  for (let sy = 1; sy * SRC_H <= AH; sy++) for (let sx = 1; sx * SRC_W <= AW; sx++) {
    const q = sx / sy; if (q < PAR_MIN - 1e-9 || q > PAR_MAX + 1e-9) continue;
    const score = sx * sy - Math.abs(q - PAR) * 0.01;      // la plus grande image d'abord, puis le PAR le plus juste
    if (!best || score > best.score) best = { sx, sy, score };
  }
  if (!best) {   // écran minuscule : on garde des entiers, rapport le plus proche possible
    const sy = Math.max(1, Math.floor(AH / SRC_H));
    best = { sx: Math.max(1, Math.min(Math.floor(AW / SRC_W), Math.round(sy * PAR))), sy };
  }
  // boîte CSS en pixels CSS entiers, tampon du canvas = boîte x dpr : 1 pixel du tampon = 1 pixel physique
  SX = best.sx; SY = best.sy;
  const cw = Math.ceil(SRC_W * SX / dpr - 1e-6), ch = Math.ceil(SRC_H * SY / dpr - 1e-6);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  OX = (cv.width - SRC_W * SX) >> 1; OY = (cv.height - SRC_H * SY) >> 1;
  // calage du coin haut-gauche sur un pixel physique entier
  cv.style.position = 'relative'; cv.style.left = cv.style.top = '0px';
  const b = cv.getBoundingClientRect(), snap = v => Number.isInteger(dpr) ? Math.round(v) - v : (Math.round(v * dpr) - v * dpr) / dpr;
  cv.style.left = snap(b.left) + 'px'; cv.style.top = snap(b.top) + 'px';
  upscale();
  cv.dataset.scale = best.sx + 'x' + best.sy + '@' + dpr;
}
function upscale() {   // agrandissement entier, plus-proche-voisin, sans lissage
  octx.imageSmoothingEnabled = false;
  octx.drawImage(nat, OX, OY, SRC_W * SX, SRC_H * SY);
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 150)); fit();
const FB = new Uint8Array(W * H);       // screen memory (pen per pixel)
const BG = new Uint8Array(W * H);       // background used to restore behind sprites
const BASE = new Uint8Array(W * H);     // pristine background image

// ---------- Commandes tactiles (multi-touch : croix + FEU en meme temps) ----------
const touch = { l: false, r: false, u: false, d: false, f: false };
(function () {
  const lg = document.getElementById('lgrp'), rg = document.getElementById('rgrp');
  const B = { l: document.getElementById('bl'), r: document.getElementById('br'), d: document.getElementById('bdig'), f: document.getElementById('bfire') };
  let fsTried = false;
  function inRect(t, el, m) { const r = el.getBoundingClientRect(); return t.clientX >= r.left - m && t.clientX <= r.right + m && t.clientY >= r.top - m && t.clientY <= r.bottom + m; }
  const midX = el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };
  function update(e) {
    let l = false, r = false, u = false, d = false, f = false;
    for (const t of e.touches) {
      // un pouce dans un groupe choisit le bouton le plus proche : glisser entre gauche/droite change de sens
      if (inRect(t, lg, 28)) { if (t.clientX < midX(lg)) l = true; else r = true; }
      else if (inRect(t, rg, 28)) { if (t.clientX < midX(rg)) d = true; else f = true; }
    }
    Object.assign(touch, { l, r, u, d, f });
    for (const k in B) B[k].classList.toggle('on', { l, r, d, f }[k]);
  }
  function start(e) {
    if (!IS_TOUCH) { IS_TOUCH_LATE(); }
    initAudio();
    if (!fsTried) {   // plein ecran au premier appui si possible (iOS Safari : absent -> on ignore)
      fsTried = true;
      const de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen;
      if (rq && !document.fullscreenElement && !navigator.standalone) { try { const p = rq.call(de, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (err) {} }
    }
    update(e);
    if (e.cancelable) e.preventDefault();
  }
  function IS_TOUCH_LATE() { document.documentElement.classList.add('touch'); setTimeout(fit, 0); }
  const opt = { passive: false };
  addEventListener('touchstart', start, opt);
  addEventListener('touchmove', e => { update(e); if (e.cancelable) e.preventDefault(); }, opt);
  addEventListener('touchend', e => { update(e); if (e.cancelable) e.preventDefault(); }, opt);
  addEventListener('touchcancel', update, opt);
  addEventListener('gesturestart', e => e.preventDefault(), opt);   // pinch-zoom iOS
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('dblclick', e => e.preventDefault());
  addEventListener('blur', () => Object.assign(touch, { l: false, r: false, u: false, d: false, f: false }));
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));
})();
let prevFire = false;
const inp = { left: false, right: false, down: false, fire: false, firePressed: false };
function readInput() {
  let l = keys.ArrowLeft || keys.KeyA || keys.key_q || keys.key_a;
  let r = keys.ArrowRight || keys.KeyD || keys.key_d;
  let d = keys.ArrowDown || keys.KeyS || keys.key_s;
  let f = keys.Space || keys.Enter || keys.KeyK;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = p.buttons;
    if (ax < -0.4 || (b[14] && b[14].pressed)) l = true;
    if (ax > 0.4 || (b[15] && b[15].pressed)) r = true;
    if (ay > 0.4 || (b[13] && b[13].pressed)) d = true;
    if ((b[0] && b[0].pressed) || (b[1] && b[1].pressed) || (b[9] && b[9].pressed)) { f = true; initAudio(); }
  }
  l = l || touch.l; r = r || touch.r; d = d || touch.d; f = f || touch.f;
  if (autopilot) ({ l, r, d, f } = autoInput());
  inp.left = !!l; inp.right = !!r; inp.down = !!d; inp.fire = !!f;
  inp.firePressed = inp.fire && !prevFire; prevFire = inp.fire;
}

// ------------------------------------------------------------------ layout (OldGraphics: 200 lines, ground y=150, HUD 0-15 / 188-199)
const GY = 150, HUD_TOP = 16, HUD_BOT = 188, ZONES = 10, ZW = 12;
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => BAY[y & 3][x & 3] / 16;
function rnd32(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function disc(buf, cx, cy, r, ax, fn) {
  for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r * ax - 1); x <= cx + r * ax + 1; x++) {
    const dx = (x + 0.5 - cx) / ax, dy = y + 0.5 - cy;
    if (dx * dx + dy * dy <= r * r) { const v = fn(x, y, dx / r, dy / r); if (v != null) px(buf, x, y, v); }
  }
}
function buildBase() {
  if (BG_IMAGE) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) BASE[y * W + x] = (y < BG_IMAGE.h && x < BG_IMAGE.w) ? BG_IMAGE.pen[y * BG_IMAGE.w + x] : 0; return; }

  const R = rnd32(1234);
  BASE.fill(T);
  for (let y = HUD_TOP; y < GY; y++) for (let x = 0; x < W; x++) BASE[y * W + x] = bay(x, y) < 0.5 ? SKYA : SKYB;
  for (let i = 0; i < 60; i++) px(BASE, R() * W | 0, HUD_TOP + R() * 100 | 0, [BW, PC, PY][R() * 3 | 0]);
  disc(BASE, 112, 60, 26, 0.6, (x, y, dx, dy) => { const l = -dx * 0.6 - dy * 0.6; return l > 0.4 ? PY : l > 0 ? BY : l > -0.4 ? OR : BR; });
  for (let x = 0; x < W; x++) { const h = 16 + 9 * Math.sin(x / 12) + 5 * Math.sin(x / 4.1) | 0; for (let y = GY - h; y < GY; y++) px(BASE, x, y, y === GY - h ? PC : MV); }
  for (let y = GY; y < HUD_BOT; y++) for (let x = 0; x < W; x++) px(BASE, x, y, y < GY + 2 ? PY : bay(x, y) < (y - GY) / 38 ? OL : OR);
}

// banners: drawn into the background, the covered bytes saved and restored afterwards

let hudKey = '';

  for (let y = 0; y < HUD_TOP; y++) BG.set(BASE.subarray(y * W, (y + 1) * W), y * W);

  for (let i = 0; i < Math.min(G.lives, 3); i++) blit(BG, spr('life_icon'), 76 + i * 8, 5);
  for (let i = 0; i < ZONES; i++) blit(BG, spr('zone_pip', i < G.zonesDone ? frameIdx('zone_pip', 'done') : frameIdx('zone_pip', 'todo')), 120 + i * 4, 6);

// zones and holes are part of the background; a strip is rebuilt when one of them changes
function zoneFrame(z) {
  const step = z.prog <= 0 ? 0 : z.prog < 1 / 3 ? 1 : z.prog < 2 / 3 ? 2 : 3;
  const fps = z.life < 2 ? fpsOf('dig_zone', 'expiring', 16) : fpsOf('dig_zone', 'normal', 5);
  return 2 * step + (((G.t * fps) | 0) & 1);
}
function redrawSurface(x0, x1) {
  x0 = Math.max(0, (x0 & ~1) - 2); x1 = Math.min(W, x1 + 2);
  for (let y = GY - 4; y < GY + 8; y++) BG.set(BASE.subarray(y * W + x0, y * W + x1), y * W + x0);
  for (const h of G.holes) if (h + ZW > x0 && h < x1) blit(BG, spr('hole'), h, GY - 1, x0, x1);
  for (const z of G.zones) if (z.x + ZW > x0 && z.x < x1) blit(BG, spr('dig_zone', z.frame), z.x, GY - 1, x0, x1);
  markDirty(x0, GY - 4, x1 - x0, 12);
}
const ASTRO_HB = () => hitbox('astronaut_right', { x: 1, y: 4, w: 6, h: 12 });
function zoneUnder() { const cx = G.astro.x + 4; for (const z of G.zones) if (Math.abs(cx - (z.x + 6)) <= 6) return z; return null; }
function spawnZone() {
  for (let tries = 0; tries < 40; tries++) {
    const x = (rnd(18, W - 14) | 0) & ~1;
    let ok = true;
    for (const z of G.zones) if (Math.abs(z.x - x) < 16) ok = false;
    if (tries < 25) for (const h of G.holes) if (Math.abs(h - x) < 13) ok = false;
    if (tries < 35 && Math.abs(x + 6 - (G.astro.x + 4)) < 10) ok = false;
    if (ok) { const z = { x, life: G.zoneLife, prog: 0, age: 0 }; z.frame = zoneFrame(z); G.zones.push(z); redrawSurface(x, x + ZW); SFX.spawn(); return; }
  }
}
function spawnMeteor() {
  const a = G.astro, big = Math.random() < 0.6, s = spr(big ? 'meteor_big' : 'meteor_small');
  let x, y;
  if (Math.random() < 0.6) { x = rnd(0, W - s.w); y = HUD_TOP; } else { x = Math.random() < 0.5 ? -s.w : W; y = rnd(24, 90); }
  const tx = a.x + 4 + rnd(-22, 22), dx = tx - x, dy = GY - y, d = Math.hypot(dx, dy), sp2 = G.meteorSpeed * (big ? 1 : 1.35) * rnd(0.85, 1.15);
  const hb = hitbox(big ? 'meteor_big' : 'meteor_small', { x: 0, y: 0, w: s.w, h: s.h });

function burst(x, y, n, pens, sp3 = 40, up = false) {
  for (let i = 0; i < n && parts.length < 90; i++) {
    const a = up ? rnd(-Math.PI, 0) : rnd(0, Math.PI * 2), s = rnd(sp3 * 0.3, sp3);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.7), pen: pens[(Math.random() * pens.length) | 0] });

function boom(cx, cy) { G.booms.push({ cx, cy, t: 0 }); burst(cx, cy, 10, [BY, OR, BR, PY]); }
function killAstro() {
  const a = G.astro;
  a.digging = false; a.deadT = 0;
  boom(a.x + 4, GY - 8); burst(a.x + 4, GY - 8, 20, [BW, GR, OR, BY], 55);
  SFX.die(); G.lives--; G.state = 'dying'; G.stateT = 2.2;

function update(dt) {
  G.t += dt; frameNo++;
  readInput();
  if (G.state === 'title') { titleTick(); if (inp.firePressed) { newGame(); SFX.ready(); } soundTick(); return; }
  if (G.state === 'gameover') { G.stateT -= dt; updateParts(dt); if (G.stateT <= 0 && inp.firePressed) toTitle(); soundTick(); return; }
  if (G.state === 'intro') { G.stateT -= dt; updatePlay(dt, false); if (G.stateT <= 0) { G.state = 'play'; unbanner(); } }
  else if (G.state === 'play') updatePlay(dt, true);
  else if (G.state === 'dying') {
    G.astro.deadT += dt; updateWorld(dt, false); G.stateT -= dt;
    if (G.stateT <= 0) {
      if (G.lives <= 0) {
        G.state = 'gameover'; G.stateT = 1.2; SFX.over();
        if (G.score > G.hi) { G.hi = G.score; G.newHi = true; try { localStorage.setItem('astroPiocheCpcHi', G.hi); } catch (e) {} }
        banner(G.newHi ? ['FIN DE PARTIE', 'NOUVEAU RECORD !'] : ['FIN DE PARTIE', 'ESPACE : MENU'], [BR, BY]);
      } else {
        G.meteors = []; G.bullets = []; Object.assign(G.astro, { visible: true, inv: 2.5, digging: false, deadT: -1 }); G.state = 'play';
      }
    }
  } else if (G.state === 'launch') {
    G.stateT -= dt; G.launchV += 60 * dt;
    if (G.stateT < 2.6) G.rocketY -= G.launchV * dt;
    if (G.rocketY + 44 > HUD_TOP) burst(6, G.rocketY + 44, 2, [GR, GR, PY, OR], 18, false);
    G.meteors = []; updateBooms(dt); updateParts(dt);
    if (G.stateT <= 0) { G.score += 500 * G.level; G.level++; startLevel(); }
  }
  if (G.readyT > 0) { G.readyT -= dt; if (G.readyT <= 0 && G.state !== 'gameover') unbanner(); }
  drawHUD();
  soundTick();
}
function updatePlay(dt, active) {
  const a = G.astro;
  a.cool -= dt; a.inv = Math.max(0, a.inv - dt); a.pose = Math.max(0, a.pose - dt);
  const zone = zoneUnder();
  if (inp.fire && a.cool <= 0 && G.bullets.length < 2) {
    const dir = inp.left ? -1 : inp.right ? 1 : 0;
    G.bullets.push({ x: a.x + (a.face > 0 ? 6 : 1), y: GY - 20, vx: dir * 70, vy: -150 });
    a.cool = 0.22; a.pose = 0.18; a.digging = false; SFX.shoot();
  }
  if (inp.down && !inp.fire && zone) {
    a.digging = true; zone.prog += dt / G.digTime; a.anim += dt; a.digSnd -= dt;
    if (a.digSnd <= 0) { SFX.dig(); a.digSnd = 0.14; burst(zone.x + 6, GY - 1, 3, [PY, OR, OL], 26, true); }
    if (zone.prog >= 1) {
      G.zones.splice(G.zones.indexOf(zone), 1); G.holes.push(zone.x); redrawSurface(zone.x, zone.x + ZW);
      G.zonesDone++; G.score += 100 + 10 * (G.level - 1); SFX.zone();
      burst(zone.x + 6, GY - 1, 14, [BR, OR, BY, PY], 45, true);
      if (G.zonesDone >= ZONES && !G.rocketReady) { G.rocketReady = true; G.readyT = 2.5; SFX.ready(); banner(['FUSEE PRETE !'], [PC], 60); }
    }
  } else {
    a.digging = false;
    const mv = inp.left ? -1 : inp.right ? 1 : 0;
    if (mv) { a.face = mv; a.x += mv * 44 * dt; a.anim += dt; }
    a.x = Math.max(G.rocketReady ? 2 : 14, Math.min(W - 8, a.x));
  }
  if (G.rocketReady && a.x <= 10 && a.visible) {
    a.visible = false; G.state = 'launch'; G.stateT = 3.2; G.launchV = 5; G.bullets = []; unbanner(); SFX.launch(); return;
  }
  if (active) {
    G.zoneT -= dt;
    if (G.zoneT <= 0 && G.zones.length < G.maxZones && G.zonesDone + G.zones.length < ZONES) { spawnZone(); G.zoneT = rnd(0.6, 1.6); }
    for (let i = G.zones.length - 1; i >= 0; i--) {
      const z = G.zones[i]; z.age += dt;
      if (!(a.digging && z === zone)) z.life -= dt;
      if (z.life <= 0) { G.zones.splice(i, 1); redrawSurface(z.x, z.x + ZW); SFX.expire(); continue; }
      const f = zoneFrame(z); if (f !== z.frame) { z.frame = f; redrawSurface(z.x, z.x + ZW); }
    }
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.meteors.length < G.maxMeteors) { spawnMeteor(); G.spawnT = G.meteorEvery * rnd(0.6, 1.4); }
    if (!G.saucer && Math.random() < dt / 22) { const left = Math.random() < 0.5; G.saucer = { x: left ? -12 : W, vx: (left ? 1 : -1) * (26 + G.level * 2), y: 22, snd: 0 }; }
  }
  updateWorld(dt, true);
}
function updateBooms(dt) { for (let i = G.booms.length - 1; i >= 0; i--) { G.booms[i].t += dt; if (G.booms[i].t > 0.3) G.booms.splice(i, 1); } }
function updateParts(dt) { for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 50 * dt; p.life -= dt; if (p.life <= 0 || p.y > GY + 1) parts.splice(i, 1); } }
function updateWorld(dt, canHit) {
  const a = G.astro, ahb = ASTRO_HB(), ax0 = a.x + ahb.x, ay0 = GY - 16 + ahb.y;
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    let dead = b.y < HUD_TOP || b.x < -2 || b.x > W + 2;
    for (let j = G.meteors.length - 1; j >= 0 && !dead; j--) {
      const m = G.meteors[j], hb = m.hb;
      if (b.x + 1 >= m.x + hb.x - 1 && b.x <= m.x + hb.x + hb.w + 1 && b.y <= m.y + hb.y + hb.h && b.y + 4 >= m.y + hb.y) {
        G.meteors.splice(j, 1); dead = true; G.score += m.big ? 20 : 50; boom(m.x + m.w / 2, m.y + m.h / 2); SFX.boom();
      }
    }
    const s = G.saucer;
    if (!dead && s) {
      const hb = hitbox('saucer', { x: 0, y: 3, w: 12, h: 5 });
      if (b.x + 1 >= s.x + hb.x && b.x <= s.x + hb.x + hb.w && b.y <= s.y + hb.y + hb.h && b.y + 4 >= s.y + hb.y) {
        dead = true; G.saucer = null; G.lives = Math.min(3, G.lives + 1); G.score += 300;
        boom(s.x + 6, s.y + 4); burst(s.x + 6, s.y + 4, 16, [BM, MV, PC, BW], 50); SFX.boom(); SFX.life();
      }
    }
    if (dead) G.bullets.splice(i, 1);
  }
  for (let i = G.meteors.length - 1; i >= 0; i--) {
    const m = G.meteors[i], hb = m.hb; m.x += m.vx * dt; m.y += m.vy * dt; m.ph += dt;
    if (m.x < -14 || m.x > W + 6) { G.meteors.splice(i, 1); continue; }
    const hit = a.visible && a.deadT < 0 && m.x + hb.x + hb.w > ax0 && m.x + hb.x < ax0 + ahb.w && m.y + hb.y + hb.h > ay0 && m.y + hb.y < ay0 + ahb.h;
    if (hit && canHit && a.inv <= 0 && G.state === 'play') { G.meteors.splice(i, 1); killAstro(); continue; }
    if (m.y + m.h >= GY) { G.meteors.splice(i, 1); boom(m.x + m.w / 2, GY - 4); burst(m.x + m.w / 2, GY - 1, 8, [PY, OR, OL], 35, true); SFX.thud(); }
  }
  const s = G.saucer;
  if (s) { s.x += s.vx * dt; s.y = 22 + Math.round(Math.sin(G.t * 3) * 3); s.snd -= dt; if (s.snd <= 0) { SFX.ufo(); s.snd = 0.16; } if (s.x < -14 || s.x > W + 2) G.saucer = null; }
  updateBooms(dt); updateParts(dt);
}

// ------------------------------------------------------------------ title screen
function toTitle() {
  unbanner();
  G = { state: 'title', t: 0, hi: G.hi };
  parts = []; buildBase(); BG.set(BASE);
  fillRect(BG, 0, 28, W, 92, K);
  for (let x = 0; x < W; x++) { px(BG, x, 28, PC); px(BG, x, 119, PC); }
  textC(BG, 34, 'ASTRO', BM, 2);
  textC(BG, 54, 'PIOCHE', BM, 2);
  textC(BG, 76, 'CREUSE LES ZONES', BW);
  textC(BG, 86, 'ABATS LES METEORES', BW);
  textC(BG, 96, 'SOUCOUPE=VIE (3 MAX)', PY);
  text(BG, 0, 4, 'AMSTRAD CPC', PC);
  text(BG, 0, 190, 'RECORD ' + String(G.hi).padStart(6, '0'), BM);
  fullRestore(); hudKey = '';
  rainbow = { pen: BM, y0: 34, y1: 70, cyc: [24, 15, 6, 7, 8, 17, 5, 2, 11, 20, 23, 25] };   // extra raster split on pen 15 over the logo
  G.blink = undefined; titleTick();
}
function titleTick() {
  const on = ((G.t * 2) | 0) % 2 === 0;
  if (on !== G.blink) { G.blink = on; fillRect(BG, 0, 106, W, 10, K); if (on) textC(BG, 107, 'ESPACE POUR JOUER', BY); markDirty(0, 106, W, 10); }
}

// ------------------------------------------------------------------ autopilot (#demo / #test / #shot)
function autoInput() {
  const o = { l: false, r: false, d: false, f: false };
  if (G.state === 'title' || G.state === 'gameover') { o.f = (G.t * 2 | 0) % 2 === 0; return o; }
  if (!G.astro) return o;
  const a = G.astro, ax = a.x + 4;
  if (a.cool <= 0 && G.bullets.length < 2) {
    for (const m of G.meteors) {
      if (m.y < 22) continue;
      for (const dir of [0, -1, 1]) {
        const bx0 = (a.x + (a.face > 0 ? 6 : 1)) & ~1;
        for (let t = 0; t < 1.2; t += 0.02) {
          const bx = bx0 + dir * 70 * t, by = GY - 18 - 150 * t, mx = m.x + m.vx * t + m.w / 2, my = m.y + m.vy * t + m.h / 2;
          if (my > GY) break;
          if (Math.abs(bx - mx) < 3 && Math.abs(by - my) < 4) { o.f = true; o.l = dir < 0; o.r = dir > 0; return o; }
        }
      }
    }
    if (G.saucer && Math.abs(G.saucer.x + 6 + G.saucer.vx * 0.85 - ax) < 4) { o.f = true; return o; }
  }
  for (const m of G.meteors) {
    if (m.vy <= 0) continue;
    const t = (GY - 10 - m.y) / m.vy, ix = m.x + m.vx * t + m.w / 2;
    if (t > 0 && t < 0.9 && Math.abs(ix - ax) < 8) { if (ix > ax || ax > W - 20) o.l = true; else o.r = true; return o; }
  }
  if (G.rocketReady) { o.l = true; return o; }
  let tz = null, best = 1e9;
  for (const z of G.zones) { const d = Math.abs(z.x + 6 - ax); if (d < best) { best = d; tz = z; } }
  if (tz) { const dx = tz.x + 6 - ax; if (Math.abs(dx) <= 4) o.d = true; else if (dx < 0) o.l = true; else o.r = true; }
  return o;
}

// ------------------------------------------------------------------ sprite pass (software sprites each frame)
function drawSprites() {
  beginFrame();
  if (G.state === 'title') {
    sprite(spr('rocket_idle'), 2, GY - 32);
    const dig = animFrames('astronaut_right', 'dig', ['dig1', 'dig2']);
    sprite(spr('astronaut_right', frameIdx('astronaut_right', dig[((G.t * 6) | 0) % dig.length])), 76, GY - 16);
    sprite(spr('saucer', (frameNo >> 3) & 1), ((G.t * 30) % (W + 24)) - 12, 125 + Math.round(Math.sin(G.t * 3) * 2));
    STATS.spritesMax = Math.max(STATS.spritesMax, drawn.length);
    return;
  }
  // rocket (+ flame during launch, beacon when ready)
  if (G.state === 'launch') sprite(spr('rocket_takeoff', (frameNo / (HZ / fpsOf('rocket_takeoff', 'x', 12)) | 0) & 1), 2, G.rocketY);
  else {
    sprite(spr('rocket_idle'), 2, G.rocketY);
    if (G.rocketReady) {                                     // "FUSEE PRETE" beacon: blinking nose light + arrow
      const on = (frameNo >> 3) & 1;
      dot(6, G.rocketY - 2, on ? BY : BR); dot(7, G.rocketY - 2, on ? BY : BR); dot(6, G.rocketY - 3, on ? PY : BY);
      if (on) for (let k = 0; k < 3; k++) { dot(16 + k * 2, GY - 24 - k, PC); dot(16 + k * 2, GY - 24 + k, PC); }
    }
  }
  for (const m of G.meteors) {                                // trail in pens 12/11/10/9 behind the meteor
    const n = Math.hypot(m.vx, m.vy) || 1;
    [BY, OR, BR, DR].forEach((pen, k) => dot(m.x + m.w / 2 - m.vx / n * (k + 1) * 3, m.y + m.h / 2 - m.vy / n * (k + 1) * 3, pen));
    const name = m.big ? 'meteor_big' : 'meteor_small';
    sprite(spr(name, (m.ph * fpsOf(name, 'x', 6) | 0) % SPR[name].frames.length), m.x, m.y);
  }
  if (G.saucer) sprite(spr('saucer', (G.t * fpsOf('saucer', 'x', 4) | 0) & 1), G.saucer.x, G.saucer.y);
  for (const b of G.booms) {
    const e = SPR.explosion, an = (e.meta && e.meta.anchor) || { x: 5, y: 8 };
    sprite(spr('explosion', (b.t * fpsOf('explosion', 'x', 10)) | 0), b.cx - an.x, b.cy - an.y);
  }
  const a = G.astro;
  if (a && (a.visible || a.deadT >= 0) && G.state !== 'launch' && !(a.inv > 0 && (frameNo >> 2) & 1)) {
    const name = a.face < 0 ? 'astronaut_left' : 'astronaut_right';
    let fname;
    if (a.deadT >= 0) { const d = animFrames(name, 'death', ['death1', 'death2', 'death3']); fname = d[Math.min(d.length - 1, (a.deadT * fpsOf(name, 'death', 6)) | 0)]; }
    else if (a.pose > 0) fname = 'shoot';
    else if (a.digging) { const d = animFrames(name, 'dig', ['dig1', 'dig2']); fname = d[((a.anim * fpsOf(name, 'dig', 8)) | 0) % d.length]; }
    else if (inp.left || inp.right) { const d = animFrames(name, 'walk', ['walk1', 'walk2', 'walk3', 'walk2']); fname = d[((a.anim * fpsOf(name, 'walk', 8)) | 0) % d.length]; }
    else fname = 'stand';
    sprite(spr(name, frameIdx(name, fname)), a.x, GY - 16);
  }
  for (const b of G.bullets) sprite(spr('shot', (frameNo >> 2) & 1), b.x, b.y);
  for (const p of parts) dot(p.x, p.y, p.pen);
  STATS.spritesMax = Math.max(STATS.spritesMax, drawn.length);
}

// ------------------------------------------------------------------ main loop (50 Hz logic)
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  let stepped = false;
  while (acc >= STEP) { if (!paused) update(STEP); else { readInput(); soundTick(); } acc -= STEP; stepped = true; }
  if (stepped) { drawSprites(); if (paused) pauseOverlay(); present(); }
  requestAnimationFrame(frame);
}
function pauseOverlay() { const y = 86; for (let yy = y; yy < y + 12; yy++) FB.fill(K, yy * W + 50, yy * W + 110); text(FB, 60, y + 2, 'PAUSE', BW); drawn.push([50, y, 60, 12]); }

const mode = location.hash.slice(1);
async function boot() {
  try { await loadAssets(); } catch (e) { ASSET_REPORT.error = String(e); }
  buildLineInks();
  toTitle();
  if (mode === 'demo') autopilot = true;
  if (mode === 'test' || mode === 'shot') {
    autopilot = true;
    const out = document.getElementById('out');
    const st = { deaths: 0, games: 0, launches: 0, maxLevel: 1, ufoLives: 0, steps: 0 };
    try {
      if (mode === 'test') {
        let ps = 'title', pl = 0;
        for (let i = 0; i < HZ * 60 * 20; i++) {
          update(STEP); drawSprites(); st.steps++;
          if (G.state === 'title' && ps !== 'title') st.games++;
          if (G.state === 'launch' && ps !== 'launch') st.launches++;
          if (G.state === 'dying' && ps !== 'dying') st.deaths++;
          if (G.level > st.maxLevel) st.maxLevel = G.level;
          if (G.lives > pl && ps === 'play' && G.state === 'play') st.ufoLives++;
          ps = G.state; pl = G.lives || 0;
          if (i % 97 === 0) {   // dirty-rect integrity: incremental FB must equal BG + current sprites
            const inc = FB.slice(), d = drawn; FB.set(BG); drawn = []; dirty = [];
            drawSprites(); STATS.checks++;
            for (let k = 0; k < FB.length; k++) if (FB[k] !== inc[k]) { STATS.mismatches++;  break; }
            FB.set(inc); drawn = d;
          }
          if (i % 500 === 0) present();
        }
        for (let k = 0; k < FB.length; k++) if (FB[k] === T && BG[k] !== T) STATS.transparentLeaks++;
        st.engine = STATS; st.assets = ASSET_REPORT;
        out.textContent = 'OK ' + JSON.stringify(st);
      } else {
        newGame();
        for (let i = 0; i < HZ * 14; i++) { update(STEP); drawSprites(); }
        if (G.state !== 'play') { newGame(); for (let i = 0; i < HZ * 4; i++) { update(STEP); drawSprites(); } }
        G.state = 'play'; G.booms = []; parts = []; unbanner();
        const z0 = G.zones[0];
        Object.assign(G.astro, { visible: true, inv: 0, pose: 0, digging: !!z0, anim: 0.07, x: z0 ? z0.x + 2 : 100, deadT: -1 });
        if (z0) { z0.prog = 0.4; z0.frame = zoneFrame(z0); redrawSurface(z0.x, z0.x + ZW); burst(z0.x + 6, GY - 1, 6, [PY, OR, OL], 20, true); updateParts(0.1); }
        G.saucer = { x: 30, vx: 30, y: 22, snd: 9 };
        const mb = spr('meteor_big'), ms = spr('meteor_small');
        G.meteors = [{ x: 60, y: 60, vx: 14, vy: 30, big: true, w: mb.w, h: mb.h, hb: hitbox('meteor_big', {}), ph: 0 },
                     { x: 132, y: 96, vx: -14, vy: 28, big: false, w: ms.w, h: ms.h, hb: hitbox('meteor_small', {}), ph: 0 },
                     { x: 36, y: 104, vx: 10, vy: 30, big: true, w: mb.w, h: mb.h, hb: hitbox('meteor_big', {}), ph: 0.2 }];
        G.bullets = [{ x: G.astro.x + 6, y: 92, vx: 0, vy: -150 }];
        drawSprites(); present(); paused = true;
        out.textContent = 'SHOT ' + JSON.stringify(ASSET_REPORT);
      }
    } catch (e) { out.textContent = 'ERROR ' + e.message + '\n' + e.stack; }
    return;
  }
  drawSprites(); present();
  requestAnimationFrame(frame);
}
window.addEventListener('error', e => { document.getElementById('out').textContent += '\nERROR ' + e.message; });
boot();
</script>

// Joué au clavier sur un appareil à pointeur fin (ordi avec écran tactile) : on masque à nouveau les commandes tactiles

  if (!e.repeat && de.classList.contains('touch') && !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) { de.classList.remove('touch'); setTimeout(fit, 0); }

(function(){
  var b=document.getElementById('homeBtn'),d=document.getElementById('homeDlg'),was=false;
  function open(){ if(d.classList.contains('on'))return; try{was=paused;paused=true;}catch(e){} d.classList.add('on'); }
  function close(){ d.classList.remove('on'); try{paused=was;}catch(e){} }
  ['touchstart','touchend','pointerdown','pointerup','mousedown','mouseup'].forEach(function(t){
    [b,d].forEach(function(el){el.addEventListener(t,function(e){e.stopPropagation();},{passive:true});});
  });
  b.addEventListener('click',open);
  document.getElementById('homeNo').addEventListener('click',close);
  addEventListener('keydown',function(e){ if(e.key==='Escape'){ d.classList.contains('on')?close():open(); } });
})();
