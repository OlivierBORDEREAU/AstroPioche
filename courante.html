<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>ASTRO PIOCHE</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:stretch;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #screen{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #out{display:none}
  /* ----- Commandes tactiles facon joystick CX40 (cachees hors tactile) ----- */
  .ctl{display:none}
  html.touch .ctl{display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  html.touch #ctlrow{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px}
  #ctlrow{display:contents}
  .grp{display:flex;gap:12px;padding:8px;border-radius:16px;background:#151515;box-shadow:inset 0 0 0 3px #262626,0 0 0 2px #0a0a0a;opacity:.9}
  .btn{position:relative;width:76px;height:76px;border-radius:12px;background:#2b2b2b;box-shadow:inset 0 0 0 2px #3a3a3a,0 4px 0 #0c0c0c;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .btn.on{transform:translateY(3px);box-shadow:inset 0 0 0 2px #4a4a4a,0 1px 0 #0c0c0c;background:#353535}
  .arrow{width:0;height:0;border:16px solid transparent}
  #bl .arrow{border-right:24px solid #c46a2c;border-left-width:0;margin-left:-6px}
  #br .arrow{border-left:24px solid #c46a2c;border-right-width:0;margin-right:-6px}
  .btn.on .arrow{filter:brightness(1.35)}
  .lbl{font:bold 9px/1 monospace;letter-spacing:1px;color:#c46a2c}
  #bfire .lbl{color:#e6a39b}
  .pick{width:30px;height:30px;image-rendering:pixelated}
  #bfire{background:transparent;box-shadow:none}
  #bfire .cap{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#e2483a,#a8160f 62%,#6e0b06);
    box-shadow:0 5px 0 #4a0603,inset 0 -3px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
  #bfire.on{transform:none;background:transparent;box-shadow:none}
  #bfire.on .cap{transform:translateY(4px);box-shadow:0 1px 0 #4a0603,inset 0 -3px 6px rgba(0,0,0,.4);filter:brightness(1.2)}
  @media (orientation:landscape){
    html.touch body{flex-direction:row;align-items:center}
    html.touch #ctlrow{display:contents}
    html.touch #padwrap{order:0;padding:0 8px 0 10px} html.touch #screen{order:1;align-self:stretch} html.touch #firewrap{order:2;padding:0 10px 0 8px}
  }
</style>
</head>
<body>
<div id="screen"><canvas id="c"></canvas></div>
<div id="ctlrow">
  <div id="padwrap" class="ctl"><div id="lgrp" class="grp"><div id="bl" class="btn" aria-label="gauche"><div class="arrow"></div></div><div id="br" class="btn" aria-label="droite"><div class="arrow"></div></div></div></div>
  <div id="firewrap" class="ctl"><div id="rgrp" class="grp"><div id="bdig" class="btn" aria-label="creuser"><svg class="pick" viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="#9a9a9a" d="M1 2h2v1h1v1h1v1h1V4h1V3h1V2h-1V1H4v1H1z"/><path fill="#c46a2c" d="M5 5h1v1h1v1h1v1h1v1H8V8H7V7H6V6H5z"/></svg><span class="lbl">CREUSER</span></div><div id="bfire" class="btn" aria-label="feu"><div class="cap"><span class="lbl">FEU</span></div></div></div></div>
</div>
<pre id="out"></pre>
<script>
"use strict";
// ================== ASTRO PIOCHE — prototype façon Atari VCS/2600 ==================
const W = 160, H = 192, GROUND = 160, STEP = 1 / 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
// Detection tactile (avant fit pour que la mise en page tienne compte des commandes)
// Page unique tactile + clavier : commandes tactiles si pointeur grossier (téléphone/tablette) ou dès le premier appui
const IS_TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
if (IS_TOUCH) document.documentElement.classList.add('touch');
function fit() {
  const sc = document.getElementById('screen'), r = sc.getBoundingClientRect();
  const aw = Math.max(1, r.width), ah = Math.max(1, r.height);
  // aspect 4:3 du tube ; agrandissement plus-proche-voisin (pixelated). Si un multiple entier de 160 tient sans trop retrecir, on l'utilise.
  let w = aw, h = w * 3 / 4;
  if (h > ah) { h = ah; w = h * 4 / 3; }
  const k = Math.floor(w / W); if (k >= 1 && k * W >= 0.85 * w) { w = k * W; h = w * 3 / 4; }   // entier si on perd <15 %, sinon plus-proche-voisin
  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(h) + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 150)); fit();

// ---------- Palette (approximation NTSC 2600) ----------
const C = {
  black: '#000000', dgray: '#404040', gray: '#6c6c6c', lgray: '#909090', silver: '#b0b0b0', white: '#ececec',
  yellow: '#fcfc68', gold: '#dcb848', orange: '#fc9c4c', red: '#d44c24', dred: '#a01c00',
  blue: '#6c90fc', dblue: '#2c3cb0', cyan: '#5cd0e0', green: '#5cbc5c', dgreen: '#207c20',
  purple: '#a050c8', pink: '#ec7cc4', brown: '#8c6430'
};
const GROUNDS = [
  { top: '#b88c58', bands: ['#a0703c', '#84582c', '#644018', '#402808'] },
  { top: '#b0b0b0', bands: ['#909090', '#6c6c6c', '#4c4c4c', '#2c2c2c'] },
  { top: '#c070c0', bands: ['#a050a8', '#803c8c', '#5c2868', '#38144c'] },
  { top: '#84c47c', bands: ['#5ca45c', '#3c843c', '#28642c', '#14441c'] },
  { top: '#d8b45c', bands: ['#bc9040', '#9c7028', '#7c5418', '#503408'] },
];

// ---------- Police 3x5 ----------
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
  'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
  'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010',
  'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'110101101101101','O':'010101101101010',
  'P':'110101110100100','Q':'010101101110011','R':'110101110101101','S':'011100111001110','T':'111010010010010',
  'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010',
  'Z':'111001010100111',' ':'000000000000000','!':'010010010000010','-':'000000111000000','+':'000010111010000',
  "'":'010010000000000',':':'000010000010000','.':'000000000000010','/':'001001010100100','x':'000101010101000'
};
function text(str, x, y, col, sx = 1, sy = 1) {
  ctx.fillStyle = col;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]] || FONT[' '];
    for (let p = 0; p < 15; p++) if (g[p] === '1')
      ctx.fillRect(x + i * 4 * sx + (p % 3) * sx, y + ((p / 3) | 0) * sy, sx, sy);
  }
}
function textC(str, y, col, sx = 1, sy = 1) { text(str, Math.round((W - (str.length * 4 - 1) * sx) / 2), y, col, sx, sy); }

// ---------- Sprites ----------
const SPR = {
  stand: ["..www...", ".wvvvw..", ".wvvvw..", "..www...", "owwwww..", "owwwww..", "o.www...", "..www...", "..w.w...", "..w.w...", "..w.w...", ".ww.ww.."],
  walk1: ["..www...", ".wvvvw..", ".wvvvw..", "..www...", "owwwww..", "owwwww..", "o.www...", "..www...", ".w..w...", ".w...w..", "w....w..", "w....ww."],
  walk2: ["..www...", ".wvvvw..", ".wvvvw..", "..www...", "owwwww..", "owwwww..", "o.www...", "..www...", "..ww....", "..w.w...", "..w.w...", ".ww.ww.."],
  dig1:  ["........", "..www...", ".wvvvw..", ".wvvvw..", "owwwwwy.", "owwww.y.", "o.www.y.", "..www.y.", ".w..w.y.", ".w..w.Y.", ".w..w.Y.", "ww..ww.."],
  dig2:  ["........", "........", "..www...", ".wvvvw..", "owvvvwy.", "owwwwwy.", "o.www.y.", "..www.y.", ".w..w.y.", ".w..w.y.", ".w..w.Y.", "ww..wwY."],
  shoot: ["..www.Y.", ".wvvvwy.", ".wvvvwy.", "..wwwwy.", "owwww...", "owwww...", "o.www...", "..www...", "..w.w...", "..w.w...", "..w.w...", ".ww.ww.."],
  rocket: ["....rr....", "...rrrr...", "...rwwr...", "..rwwwwr..", "..wwwwww..", "..wwbbww..", "..wbccbw..", "..wwbbww..",
           "..wwwwww..", "..rrrrrr..", "..wwwwww..", "..wwwwww..", "..wwwwww..", "..wwrrww..", "..wwwwww..", ".rwwwwwwr.",
           "rrwwwwwwrr", "rr.wwww.rr", "r..gggg..r", "...g..g..."],
  saucer: ["....pppp....", "..ppccccpp..", "pppppppppppp", ".y.y.y.y.y.y", "..pppppppp.."],
  meteorB: [".mmm.", "mmMmm", "mMmmm", "mmmMm", ".mmm."],
  meteorS: [".m.", "mMm", ".m."],
  heart:  ["ww.", "www", ".w."],
};
const ROCKET_H = SPR.rocket.length;
function spr(s, x, y, map, flip = false) {
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < s.length; r++) {
    const row = s[r], n = row.length;
    for (let c = 0; c < n; c++) {
      const ch = row[c]; if (ch === '.') continue;
      const col = map[ch]; if (!col) continue;
      ctx.fillStyle = col; ctx.fillRect(x + (flip ? n - 1 - c : c), y + r, 1, 1);
    }
  }
}
const ASTRO_MAP = { w: C.white, v: C.blue, o: C.orange, y: C.lgray, Y: C.yellow };
const ROCKET_MAP = { r: C.red, w: C.white, b: C.dblue, c: C.cyan, g: C.gray };

// ---------- Décor fixe ----------
let seed = 1234; function srand() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
const STARS = []; for (let i = 0; i < 40; i++) STARS.push({ x: (srand() * W) | 0, y: 14 + (srand() * 130) | 0, t: srand() * 6 });
const ROCKS = []; for (let i = 0; i < 18; i++) ROCKS.push({ x: 20 + (srand() * 136) | 0, w: 1 + (srand() * 3) | 0 });
const CRATERS = []; for (let i = 0; i < 9; i++) CRATERS.push({ x: (srand() * 150) | 0, y: GROUND + 6 + (srand() * 14) | 0, w: 4 + (srand() * 6) | 0 });

// ---------- Son (WebAudio, activé au premier appui) ----------
let AC = null, muted = false;
function initAudio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; }
}
function beep(f, dur, type = 'square', vol = 0.06, f2 = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
let NOISE = null;
function noise(dur, vol = 0.15, freq = 1500) {
  if (!AC || muted) return;
  if (!NOISE) {
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); let v = 0;
    for (let i = 0; i < d.length; i++) { if (i % 6 === 0) v = Math.random() * 2 - 1; d[i] = v; } // bruit "crade" façon TIA
  }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SFX = {
  shoot: () => beep(1200, 0.08, 'square', 0.05, 300),
  dig: () => noise(0.05, 0.08, 600),
  zone: () => { beep(523, 0.08); setTimeout(() => beep(784, 0.12), 80); },
  boom: () => noise(0.35, 0.2, 1800),
  thud: () => noise(0.18, 0.1, 500),
  die: () => { noise(0.9, 0.25, 900); beep(400, 0.8, 'sawtooth', 0.05, 40); },
  spawn: () => beep(200, 0.06, 'square', 0.03, 260),
  expire: () => beep(150, 0.2, 'square', 0.04, 90),
  ufo: () => beep(900, 0.09, 'triangle', 0.03, 1300),
  life: () => { [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.09), i * 70)); },
  ready: () => { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.1), i * 90)); },
  launch: () => { noise(2.2, 0.18, 700); beep(80, 2.2, 'sawtooth', 0.04, 600); },
  over: () => { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'square', 0.05), i * 220)); },
};

// ---------- Entrées ----------
const keys = {};
let paused = false, autopilot = false;
const BLOCK = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', e => {
  initAudio(); keys[e.code] = true;
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP' && G && G.state !== 'title') paused = !paused;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('pointerdown', initAudio);
// ---------- Commandes tactiles (multi-touch : croix + FEU en meme temps) ----------
const touch = { l: false, r: false, u: false, d: false, f: false };
(function () {
  const lg = document.getElementById('lgrp'), rg = document.getElementById('rgrp');
  const B = { l: document.getElementById('bl'), r: document.getElementById('br'), d: document.getElementById('bdig'), f: document.getElementById('bfire') };
  let fsTried = false;
  function inRect(t, el, m) { const r = el.getBoundingClientRect(); return t.clientX >= r.left - m && t.clientX <= r.right + m && t.clientY >= r.top - m && t.clientY <= r.bottom + m; }
  const midX = el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };
  function update(e) {
    let l = false, r = false, u = false, d = false, f = false;
    for (const t of e.touches) {
      // un pouce dans un groupe choisit le bouton le plus proche : glisser entre gauche/droite change de sens
      if (inRect(t, lg, 28)) { if (t.clientX < midX(lg)) l = true; else r = true; }
      else if (inRect(t, rg, 28)) { if (t.clientX < midX(rg)) d = true; else f = true; }
    }
    Object.assign(touch, { l, r, u, d, f });
    for (const k in B) B[k].classList.toggle('on', { l, r, d, f }[k]);
  }
  function start(e) {
    if (!IS_TOUCH) { IS_TOUCH_LATE(); }
    initAudio();
    if (!fsTried) {   // plein ecran au premier appui si possible (iOS Safari : absent -> on ignore)
      fsTried = true;
      const de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen;
      if (rq && !document.fullscreenElement && !navigator.standalone) { try { const p = rq.call(de, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (err) {} }
    }
    update(e);
    if (e.cancelable) e.preventDefault();
  }
  function IS_TOUCH_LATE() { document.documentElement.classList.add('touch'); setTimeout(fit, 0); }
  const opt = { passive: false };
  addEventListener('touchstart', start, opt);
  addEventListener('touchmove', e => { update(e); if (e.cancelable) e.preventDefault(); }, opt);
  addEventListener('touchend', e => { update(e); if (e.cancelable) e.preventDefault(); }, opt);
  addEventListener('touchcancel', update, opt);
  addEventListener('gesturestart', e => e.preventDefault(), opt);   // pinch-zoom iOS
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('dblclick', e => e.preventDefault());
  addEventListener('blur', () => Object.assign(touch, { l: false, r: false, u: false, d: false, f: false }));
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));
})();
let prevFire = false;
const inp = { left: false, right: false, down: false, fire: false, firePressed: false };
function readInput() {
  let l = keys.ArrowLeft || keys.KeyA, r = keys.ArrowRight || keys.KeyD, d = keys.ArrowDown || keys.KeyS;
  let f = keys.Space || keys.KeyK || keys.Enter;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = p.buttons;
    if (ax < -0.4 || (b[14] && b[14].pressed)) l = true;
    if (ax > 0.4 || (b[15] && b[15].pressed)) r = true;
    if (ay > 0.4 || (b[13] && b[13].pressed)) d = true;
    if ((b[0] && b[0].pressed) || (b[1] && b[1].pressed) || (b[9] && b[9].pressed)) { f = true; initAudio(); }
  }
  l = l || touch.l; r = r || touch.r; d = d || touch.d; f = f || touch.f;
  if (autopilot) ({ l, r, d, f } = autoInput());
  inp.left = !!l; inp.right = !!r; inp.down = !!d; inp.fire = !!f;
  inp.firePressed = inp.fire && !prevFire; prevFire = inp.fire;
}

// ---------- État du jeu ----------
let G = { state: 'title', t: 0, hi: 0 };
try { G.hi = +localStorage.getItem('astroPiocheHi') || 0; } catch (e) {}
function saveHi() {   // record conserve meme si on quitte en cours de partie
  if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('astroPiocheHi', G.hi); } catch (e) {} }
}
addEventListener('pagehide', saveHi);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveHi(); });
const rnd = (a, b) => a + Math.random() * (b - a);

function newGame() {
  const hi = G.hi;
  G = { state: 'intro', t: 0, hi, level: 1, score: 0, lives: 3 };
  startLevel();
}
function startLevel() {
  const L = G.level;
  Object.assign(G, {
    zonesDone: 0, zonesActive: 0, zones: [], holes: [], meteors: [], bullets: [], parts: [], texts: [],
    saucer: null, rocketReady: false, rocketY: GROUND - ROCKET_H, flash: 0,
    astro: { x: 76, face: 1, digging: false, inv: 0, anim: 0, cool: 0, pose: 0, visible: true, digSnd: 0 },
    maxZones: Math.min(2 + Math.floor((L - 1) / 2), 5),
    zoneLife: Math.max(3.5, 9 - (L - 1) * 0.6),
    digTime: Math.min(1.6, 0.9 + (L - 1) * 0.07),
    meteorEvery: Math.max(0.3, 1.8 - (L - 1) * 0.15),
    meteorSpeed: Math.min(95, 26 + (L - 1) * 6),
    maxMeteors: Math.min(9, 2 + L),
    spawnT: 1.5, zoneT: 0.3, ground: GROUNDS[(L - 1) % GROUNDS.length],
    state: 'intro', stateT: 2,
  });
}
const ZONES_PER_LEVEL = 10;

function addText(x, y, str, col, life = 1) { G.texts.push({ x, y, str, col, life }); }
function burst(x, y, n, cols, sp = 40, up = false) {
  for (let i = 0; i < n; i++) {
    const a = up ? rnd(-Math.PI, 0) : rnd(0, Math.PI * 2), s = rnd(sp * 0.3, sp);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.8), col: cols[(Math.random() * cols.length) | 0] });
  }
}
function zoneUnder() {
  const cx = G.astro.x + 4;
  for (const z of G.zones) if (Math.abs(cx - (z.x + 6)) <= 6) return z;
  return null;
}
function spawnZone() {
  for (let tries = 0; tries < 40; tries++) {
    const x = (rnd(22, W - 16)) | 0;
    let ok = true;
    for (const z of G.zones) if (Math.abs(z.x - x) < 16) ok = false;
    if (tries < 25) for (const h of G.holes) if (Math.abs(h.x - x) < 13) ok = false;   // évite les anciens trous si possible
    if (tries < 35 && Math.abs(x + 6 - (G.astro.x + 4)) < 10) ok = false;
    if (ok) { G.zones.push({ x, life: G.zoneLife, max: G.zoneLife, prog: 0, age: 0 }); G.zonesActive++; SFX.spawn(); return; }
  }
}
function spawnMeteor() {
  const a = G.astro, big = Math.random() < 0.6;
  let x, y;
  if (Math.random() < 0.6) { x = rnd(0, W); y = 8; }
  else { x = Math.random() < 0.5 ? -5 : W + 5; y = rnd(20, 90); }
  const tx = a.x + 4 + rnd(-22, 22), ty = GROUND;
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy), sp = G.meteorSpeed * (big ? 1 : 1.35) * rnd(0.85, 1.15);
  G.meteors.push({ x, y, vx: dx / d * sp, vy: dy / d * sp, big, s: big ? 5 : 3 });
}
function killAstro() {
  const a = G.astro;
  a.visible = false; a.digging = false;
  burst(a.x + 4, GROUND - 6, 40, [C.white, C.orange, C.yellow, C.red], 60);
  SFX.die(); G.lives--; G.state = 'dying'; G.stateT = 2.2; G.flash = 0.15;
}

function update(dt) {
  G.t += dt;
  readInput();
  if (G.state === 'title') { if (inp.firePressed) newGame(); return; }
  if (G.state === 'gameover') {
    G.stateT -= dt; updateFx(dt);
    if (G.stateT <= 0 && inp.firePressed) { G.state = 'title'; G.t = 0; }
    return;
  }
  if (G.flash > 0) G.flash -= dt;
  if (G.state === 'intro') { G.stateT -= dt; updatePlay(dt, false); if (G.stateT <= 0) G.state = 'play'; }
  else if (G.state === 'play') updatePlay(dt, true);
  else if (G.state === 'dying') {
    updateWorld(dt, false); G.stateT -= dt;
    if (G.stateT <= 0) {
      if (G.lives <= 0) {
        G.state = 'gameover'; G.stateT = 1.2; SFX.over();
        if (G.score > G.hi) { G.hi = G.score; G.newHi = true; try { localStorage.setItem('astroPiocheHi', G.hi); } catch (e) {} }
      } else {
        G.meteors = []; G.bullets = [];
        Object.assign(G.astro, { visible: true, inv: 2.5, digging: false });
        G.state = 'play';
      }
    }
  } else if (G.state === 'launch') {
    G.stateT -= dt; G.launchV += 60 * dt;
    if (G.stateT < 2.6) G.rocketY -= G.launchV * dt;
    burst(7, G.rocketY + ROCKET_H, 2, [C.orange, C.yellow, C.red, C.lgray], 25, false);
    G.meteors = [];
    updateFx(dt);
    if (G.stateT <= 0) {
      const bonus = 500 * G.level;
      G.score += bonus; G.level++; startLevel(); addText(80, 70, 'BONUS ' + bonus, C.yellow, 2);
    }
  }
}

function updatePlay(dt, active) {
  const a = G.astro;
  a.cool -= dt; a.inv = Math.max(0, a.inv - dt); a.pose = Math.max(0, a.pose - dt);
  const zone = zoneUnder();
  // TIR : interrompt le creusage
  if (inp.fire && a.cool <= 0 && G.bullets.length < 2) {
    const dir = inp.left ? -1 : inp.right ? 1 : 0;
    G.bullets.push({ x: a.x + (a.face > 0 ? 6 : 1) + dir, y: GROUND - 13, vx: dir * 70, vy: -150 });
    a.cool = 0.22; a.pose = 0.18; a.digging = false; SFX.shoot();
  }
  if (inp.down && !inp.fire && zone) {
    a.digging = true;
    zone.prog += dt / G.digTime;
    a.anim += dt; a.digSnd -= dt;
    if (a.digSnd <= 0) { SFX.dig(); a.digSnd = 0.14; burst(zone.x + 6, GROUND, 2, [G.ground.top, G.ground.bands[0], C.orange], 22, true); }
    if (zone.prog >= 1) {
      G.zones.splice(G.zones.indexOf(zone), 1); G.holes.push({ x: zone.x });
      G.zonesDone++; const pts = 100 + 10 * (G.level - 1); G.score += pts;
      addText(zone.x + 6, GROUND - 22, '+' + pts, C.yellow);
      burst(zone.x + 6, GROUND, 14, [C.orange, C.red, C.yellow], 45, true); SFX.zone();
      if (G.zonesDone >= ZONES_PER_LEVEL && !G.rocketReady) {
        G.rocketReady = true; SFX.ready(); addText(80, 60, 'FUSEE PRETE !', C.green, 2.5);
      }
    }
  } else {
    a.digging = false;
    let mv = 0;
    if (inp.left) mv = -1; else if (inp.right) mv = 1;
    if (mv) { a.face = mv; a.x += mv * 44 * dt; a.anim += dt; }
    a.x = Math.max(G.rocketReady ? 4 : 16, Math.min(W - 9, a.x));
  }
  // Embarquement
  if (G.rocketReady && a.x <= 9 && a.visible) {
    a.visible = false; G.state = 'launch'; G.stateT = 3.2; G.launchV = 5; SFX.launch();
    G.bullets = [];
    return;
  }
  // Zones
  if (active) {
    G.zoneT -= dt;
    if (G.zoneT <= 0 && G.zones.length < G.maxZones && G.zonesDone + G.zones.length < ZONES_PER_LEVEL) {
      spawnZone(); G.zoneT = rnd(0.6, 1.6);
    }
    for (let i = G.zones.length - 1; i >= 0; i--) {
      const z = G.zones[i]; z.age += dt;
      if (!(a.digging && z === zone)) z.life -= dt;
      if (z.life <= 0) { G.zones.splice(i, 1); SFX.expire(); burst(z.x + 6, GROUND, 6, [C.dgray, C.gray], 20, true); }
    }
    // Météorites
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.meteors.length < G.maxMeteors) { spawnMeteor(); G.spawnT = G.meteorEvery * rnd(0.6, 1.4); }
    // Soucoupe (rare)
    if (!G.saucer && Math.random() < dt / 22) {
      const left = Math.random() < 0.5;
      G.saucer = { x: left ? -12 : W, vx: (left ? 1 : -1) * (26 + G.level * 2), y: 24, snd: 0 };
    }
  }
  updateWorld(dt, true);
}

function updateWorld(dt, canHit) {
  const a = G.astro;
  // Balles
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    let dead = b.y < 10 || b.x < -2 || b.x > W + 2;
    for (let j = G.meteors.length - 1; j >= 0 && !dead; j--) {
      const m = G.meteors[j];
      if (b.x >= m.x - 2 && b.x <= m.x + m.s + 1 && b.y >= m.y - 3 && b.y <= m.y + m.s + 1) {
        G.meteors.splice(j, 1); dead = true;
        const pts = m.big ? 20 : 50; G.score += pts;
        burst(m.x + m.s / 2, m.y + m.s / 2, 12, [C.orange, C.lgray, C.yellow, C.brown], 40); SFX.boom();
      }
    }
    const s = G.saucer;
    if (!dead && s && b.x >= s.x - 1 && b.x <= s.x + 13 && b.y >= s.y - 3 && b.y <= s.y + 6) {
      dead = true; G.saucer = null;
      G.lives = Math.min(9, G.lives + 1); G.score += 300;
      burst(s.x + 6, s.y + 2, 30, [C.purple, C.pink, C.cyan, C.yellow, C.white], 55);
      addText(s.x + 6, s.y + 8, '+1 VIE', C.pink, 1.6); SFX.boom(); SFX.life();
    }
    if (dead) G.bullets.splice(i, 1);
  }
  // Météorites
  for (let i = G.meteors.length - 1; i >= 0; i--) {
    const m = G.meteors[i]; m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < -12 || m.x > W + 12) { G.meteors.splice(i, 1); continue; }
    const hitAstro = a.visible && m.x + m.s > a.x + 1 && m.x < a.x + 7 && m.y + m.s > GROUND - 11 && m.y < GROUND;
    if (hitAstro && canHit && a.inv <= 0 && G.state === 'play') { G.meteors.splice(i, 1); killAstro(); continue; }
    if (m.y + m.s >= GROUND) {
      G.meteors.splice(i, 1);
      burst(m.x + m.s / 2, GROUND - 1, 10, [C.lgray, G.ground.top, C.orange], 35, true); SFX.thud();
    }
  }
  // Soucoupe
  const s = G.saucer;
  if (s) {
    s.x += s.vx * dt; s.y = 24 + Math.round(Math.sin(G.t * 3) * 3);
    s.snd -= dt; if (s.snd <= 0) { SFX.ufo(); s.snd = 0.25; }
    if (s.x < -14 || s.x > W + 2) G.saucer = null;
  }
  updateFx(dt);
}
function updateFx(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; p.life -= dt;
    if (p.life <= 0 || p.y > GROUND + 2) G.parts.splice(i, 1);
  }
  for (let i = G.texts.length - 1; i >= 0; i--) { const t = G.texts[i]; t.y -= 10 * dt; t.life -= dt; if (t.life <= 0) G.texts.splice(i, 1); }
}

// ---------- Pilote automatique (démo / tests : index.html#demo) ----------
function autoInput() {
  const o = { l: false, r: false, d: false, f: false };
  if (G.state === 'title' || G.state === 'gameover') { o.f = (G.t * 2 | 0) % 2 === 0; return o; }
  if (!G.astro) return o;
  const a = G.astro, ax = a.x + 4;
  // cherche un tir (tout droit ou en diagonale) qui intercepte une météorite
  if (a.cool <= 0 && G.bullets.length < 2) {
    for (const m of G.meteors) {
      if (m.y < 20) continue;
      for (const dir of [0, -1, 1]) {
        const bx0 = a.x + (a.face > 0 ? 6 : 1) + dir;
        for (let t = 0; t < 1.2; t += 0.02) {
          const bx = bx0 + dir * 70 * t, by = GROUND - 13 - 150 * t, mx = m.x + m.vx * t + m.s / 2, my = m.y + m.vy * t + m.s / 2;
          if (my > GROUND) break;
          if (Math.abs(bx - mx) < 2.5 && Math.abs(by - my) < 3) { o.f = true; o.l = dir < 0; o.r = dir > 0; return o; }
        }
      }
    }
    if (G.saucer && Math.abs(G.saucer.x + 6 + G.saucer.vx * 0.8 - ax) < 4) { o.f = true; return o; }
  }
  // esquive : une météorite va tomber sur nous
  for (const m of G.meteors) {
    if (m.vy <= 0) continue;
    const t = (GROUND - 6 - m.y) / m.vy, ix = m.x + m.vx * t + m.s / 2;
    if (t > 0 && t < 0.9 && Math.abs(ix - ax) < 8) { if (ix > ax || ax > W - 20) o.l = true; else o.r = true; return o; }
  }
  if (G.rocketReady) { o.l = true; return o; }
  let tz = null, best = 1e9;
  for (const z of G.zones) { const d = Math.abs(z.x + 6 - ax); if (d < best) { best = d; tz = z; } }
  if (tz) {
    const dx = tz.x + 6 - ax;
    if (Math.abs(dx) <= 4) o.d = true; else if (dx < 0) o.l = true; else o.r = true;
  }
  return o;
}

// ---------- Rendu ----------
function drawBackground(groundPal, planet = true) {
  ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const tw = Math.sin(G.t * 2 + s.t) > 0.85;
    ctx.fillStyle = tw ? C.white : (s.t > 3 ? C.gray : C.lgray); ctx.fillRect(s.x, s.y, 1, 1);
  }
  // planète lointaine à bandes
  if (planet) {
  const px = 130, py = 46, r = 11, bands = [C.dblue, C.blue, C.cyan, C.blue, C.dblue, C.purple];
  for (let y = -r; y <= r; y++) {
    const w = Math.round(Math.sqrt(r * r - y * y) * 1.2);
    ctx.fillStyle = bands[((y + r) / 4 | 0) % bands.length]; ctx.fillRect(px - w, py + y, w * 2, 1);
  }
  ctx.fillStyle = C.lgray; ctx.fillRect(px - 20, py + 1, 40, 1);   // anneau
  }
  // sol de l'astéroïde : bandes horizontales façon VCS
  const g = groundPal;
  ctx.fillStyle = g.top; ctx.fillRect(0, GROUND, W, 2);
  for (const k of ROCKS) ctx.fillRect(k.x, GROUND - 1, k.w, 1);
  const bh = [6, 7, 8, 9];
  let y = GROUND + 2;
  for (let i = 0; i < 4; i++) { ctx.fillStyle = g.bands[i]; ctx.fillRect(0, y, W, bh[i]); y += bh[i]; }
  ctx.fillStyle = g.bands[3];
  for (const c of CRATERS) if (c.y < GROUND + 20) { ctx.fillStyle = g.bands[Math.min(3, ((c.y - GROUND) / 7 | 0) + 1)]; ctx.fillRect(c.x, c.y, c.w, 1); }
}
function drawHUD() {
  text(String(G.score).padStart(6, '0'), 3, 2, C.yellow, 2, 2);
  // vies (petits casques)
  for (let i = 0; i < Math.min(G.lives, 6); i++) spr(SPR.heart, W - 6 - i * 5, 4, { w: C.white });
  if (G.lives > 6) text('+', W - 36, 3, C.white);
  // jauge de zones
  const x0 = 60;
  for (let i = 0; i < ZONES_PER_LEVEL; i++) {
    ctx.fillStyle = i < G.zonesDone ? C.green : C.dred; ctx.fillRect(x0 + i * 4, 5, 3, 3);
  }
  text('NIVEAU ' + G.level, 3, H - 6, C.white);
  text('RECORD ' + String(Math.max(G.hi, G.score)).padStart(6, '0'), W - 57, H - 6, C.lgray);
}
function render() {
  if (G.state === 'title') { renderTitle(); return; }
  drawBackground(G.ground);
  const a = G.astro, blink = (G.t * 8 | 0) % 2 === 0;
  // trous déjà creusés
  for (const h of G.holes) {
    ctx.fillStyle = C.black; ctx.fillRect(h.x + 1, GROUND, 10, 3); ctx.fillRect(h.x + 3, GROUND + 3, 6, 2);
    ctx.fillStyle = G.ground.bands[2]; ctx.fillRect(h.x, GROUND - 1, 2, 1); ctx.fillRect(h.x + 10, GROUND - 1, 2, 1);
  }
  // zones à creuser (clignotent orange/rouge, plus vite quand elles vont disparaître)
  for (const z of G.zones) {
    const rate = z.life < 2 ? 16 : 5;
    const col = ((G.t * rate) | 0) % 2 ? C.orange : C.red;
    const w = Math.max(2, Math.round(12 * (1 - z.prog))), off = (12 - w) >> 1;
    ctx.fillStyle = col; ctx.fillRect(z.x + off, GROUND - 1, w, 4);
    if (z.prog > 0) { ctx.fillStyle = C.black; ctx.fillRect(z.x + 1, GROUND + 1, Math.round(10 * z.prog), 2); }
    if (z.age < 0.6 && blink) { ctx.fillStyle = C.yellow; ctx.fillRect(z.x + 5, GROUND - 4, 2, 2); }
  }
  // fusée
  const ry = Math.round(G.rocketY);
  spr(SPR.rocket, 2, ry, ROCKET_MAP);
  if (G.rocketReady && G.state !== 'launch') {
    ctx.fillStyle = blink ? C.green : C.yellow; ctx.fillRect(6, ry - 2, 2, 2);
    if (((G.t * 3) | 0) % 2) { ctx.fillStyle = C.green; ctx.fillRect(14, GROUND - 12, 2, 1); ctx.fillRect(13, GROUND - 13, 1, 3); }
  }
  if (G.state === 'launch') {
    const fl = 4 + ((G.t * 30) | 0) % 4;
    ctx.fillStyle = C.yellow; ctx.fillRect(5, ry + ROCKET_H, 4, fl);
    ctx.fillStyle = C.orange; ctx.fillRect(4, ry + ROCKET_H + 1, 6, fl - 2);
  }
  // astronaute
  if (a.visible && !(a.inv > 0 && blink)) {
    let s = SPR.stand;
    if (a.pose > 0) s = SPR.shoot;
    else if (a.digging) s = ((a.anim * 8) | 0) % 2 ? SPR.dig1 : SPR.dig2;
    else if (inp.left || inp.right) s = ((a.anim * 8) | 0) % 2 ? SPR.walk1 : SPR.walk2;
    spr(s, a.x, GROUND - 12, ASTRO_MAP, a.face < 0);
  }
  // balles
  ctx.fillStyle = C.yellow;
  for (const b of G.bullets) ctx.fillRect(Math.round(b.x), Math.round(b.y), 1, 3);
  // météorites (avec petite traînée)
  for (const m of G.meteors) {
    ctx.fillStyle = C.dred; ctx.fillRect(Math.round(m.x - m.vx * 0.04 + m.s / 2 - 1), Math.round(m.y - m.vy * 0.04 + m.s / 2 - 1), 2, 2);
    spr(m.big ? SPR.meteorB : SPR.meteorS, m.x, m.y, { m: C.brown, M: C.orange });
  }
  // soucoupe
  if (G.saucer) spr(SPR.saucer, G.saucer.x, G.saucer.y, { p: C.purple, c: C.cyan, y: blink ? C.yellow : C.pink });
  // particules
  for (const p of G.parts) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const t of G.texts) textC2(t.str, t.x, t.y, t.col);
  drawHUD();
  // bannières
  if (G.state === 'intro') { textC('NIVEAU ' + G.level, 74, C.white, 2, 2); textC('CREUSE 10 ZONES', 92, C.orange); }
  if (G.state === 'gameover') {
    textC('FIN DE PARTIE', 70, C.red, 2, 2);
    if (G.newHi && blink) textC('NOUVEAU RECORD !', 92, C.yellow);
    if (G.stateT <= 0) textC('FEU POUR CONTINUER', 104, C.lgray);
  }
  if (paused && mode !== 'shot') textC('PAUSE', 80, C.white, 2, 2);
  if (G.flash > 0) { ctx.fillStyle = 'rgba(236,236,236,0.6)'; ctx.fillRect(0, 0, W, H); }
}
function textC2(str, cx, y, col) { text(str, Math.round(cx - (str.length * 4 - 1) / 2), Math.round(y), col); }

function renderTitle() {
  drawBackground(GROUNDS[0], false);
  const cols = [C.orange, C.yellow, C.red, C.orange];
  ctx.fillStyle = C.dred; ctx.fillRect(0, 22, W, 2); ctx.fillRect(0, 72, W, 2);
  textC('ASTRO', 28, cols[(G.t * 4 | 0) % 4], 3, 3);
  textC('PIOCHE', 48, C.orange, 3, 4);
  textC('CREUSE LES ZONES QUI CLIGNOTENT', 86, C.white);
  textC('ABATS LES METEORITES', 96, C.white);
  textC('LA SOUCOUPE DONNE UNE VIE', 106, C.pink);
  if ((G.t * 2 | 0) % 2 === 0) textC('APPUIE SUR FEU', 124, C.yellow);
  textC('FLECHES OU WASD : BOUGER', 134, C.lgray);
  textC('BAS : CREUSER   ESPACE : FEU', 142, C.lgray);
  spr(SPR.rocket, 2, GROUND - ROCKET_H, ROCKET_MAP);
  spr(((G.t * 3) | 0) % 2 ? SPR.dig1 : SPR.dig2, 76, GROUND - 12, ASTRO_MAP);
  ctx.fillStyle = ((G.t * 5) | 0) % 2 ? C.orange : C.red; ctx.fillRect(78, GROUND - 1, 12, 4);
  if (G.t % 8 < 4) spr(SPR.saucer, ((G.t % 8) / 4) * (W + 14) - 12, 150 - 6 * 20 + Math.round(Math.sin(G.t * 3) * 3), { p: C.purple, c: C.cyan, y: C.yellow });
  text('RECORD ' + String(G.hi).padStart(6, '0'), W - 57, H - 6, C.lgray);
  text('2026', 3, H - 6, C.white);
}

// ---------- Boucle ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { if (!paused) update(STEP); else readInput(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

// Modes spéciaux : #demo (le jeu se joue tout seul), #shot (capture d'écran), #test (simulation rapide)
const mode = location.hash.slice(1);
if (mode === 'demo') autopilot = true;
if (mode === 'shot' || mode === 'test') {
  autopilot = true;
  const out = document.getElementById('out'), stats = { levels: 1, deaths: 0, games: 0, maxLevel: 1, zones: 0, ufo: 0, steps: 0 };
  try {
    if (mode === 'shot') {
      newGame();
      for (let i = 0; i < 60 * 16; i++) update(STEP);
      if (G.state !== 'play') { newGame(); for (let i = 0; i < 60 * 4; i++) update(STEP); }
      G.state = 'play'; G.parts = []; G.texts = [];
      const z0 = G.zones[0]; Object.assign(G.astro, { visible: true, inv: 0, pose: 0, digging: !!z0, anim: 0.07, x: z0 ? z0.x + 2 : 100 });
      if (z0) z0.prog = 0.45;
      G.saucer = { x: 40, vx: 30, y: 24, snd: 9 };
      G.meteors.push({ x: 112, y: 70, vx: -12, vy: 24, big: true, s: 5 }, { x: 30, y: 96, vx: 20, vy: 22, big: false, s: 3 });
      paused = true; render();
    } else {
      let prevState = '', prevLives = 0;
      for (let i = 0; i < 60 * 60 * 20; i++) {
        update(STEP); stats.steps++;
        if (G.state === 'title' && prevState !== 'title') stats.games++;
        if (G.state === 'launch' && prevState !== 'launch') stats.launches = (stats.launches || 0) + 1;
        if (G.level && G.level > stats.maxLevel) stats.maxLevel = G.level;
        if (G.state === 'dying' && prevState !== 'dying') stats.deaths++;
        if (G.lives > prevLives && prevState === 'play' && G.state === 'play') stats.ufo++;
        prevState = G.state; prevLives = G.lives || 0;
        if (i % 600 === 0) render();
      }
      stats.final = { state: G.state, level: G.level, score: G.score, lives: G.lives };
      out.textContent = 'OK ' + JSON.stringify(stats);
    }
  } catch (e) { out.textContent = 'ERROR ' + e.message + '\n' + e.stack; }
  if (mode === 'test') { /* pas de boucle */ } else requestAnimationFrame(t => { last = t; });
} else {
  requestAnimationFrame(frame);
}
window.addEventListener('error', e => { document.getElementById('out').textContent += '\nERROR ' + e.message; });
</script>

#homeDlg{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);font-family:ui-monospace,Menlo,monospace}
#homeDlg.on{display:flex}
#homeDlg div{background:#0d0a24;border:3px solid #ffd84a;border-radius:10px;padding:20px 22px;text-align:center;color:#ffd84a;max-width:80vw;box-shadow:6px 6px 0 #c0392b}
#homeDlg p{margin:0 0 6px;font-size:18px;letter-spacing:1px}
#homeDlg small{display:block;color:#8fa;margin-bottom:16px;font-size:12px}
#homeDlg a,#homeDlg button{display:inline-block;margin:0 6px;padding:12px 22px;font:inherit;font-size:16px;font-weight:bold;border-radius:6px;border:2px solid #ffd84a;cursor:pointer;text-decoration:none;touch-action:manipulation}
#homeDlg a{background:#ffd84a;color:#000}
#homeDlg button{background:transparent;color:#ffd84a}
</style>
<button id="homeBtn" aria-label="Accueil"><svg viewBox="0 0 11 11"><g fill="#ffd84a"><path d="M5 0h1v1H5zM4 1h3v1H4zM3 2h5v1H3zM2 3h7v1H2zM1 4h9v1H1z"/><path d="M2 5h7v6H2z"/></g><path fill="#0d0a24" d="M4 7h3v4H4z"/><path fill="#c0392b" d="M5 2h1v1H5z"/></svg></button>
<div id="homeDlg"><div><p>Retour à l'accueil ?</p><small>La partie en cours sera perdue (le record est gardé).</small><a href="index.html" id="homeYes">OUI</a><button id="homeNo">NON</button></div></div>
<script>
(function(){
  var b=document.getElementById('homeBtn'),d=document.getElementById('homeDlg'),was=false;
  function open(){ if(d.classList.contains('on'))return; try{was=paused;paused=true;}catch(e){} d.classList.add('on'); }
  function close(){ d.classList.remove('on'); try{paused=was;}catch(e){} }
  ['touchstart','touchend','pointerdown','pointerup','mousedown','mouseup'].forEach(function(t){
    [b,d].forEach(function(el){el.addEventListener(t,function(e){e.stopPropagation();},{passive:true});});
  });
  b.addEventListener('click',open);
  document.getElementById('homeNo').addEventListener('click',close);
  addEventListener('keydown',function(e){ if(e.key==='Escape'){ d.classList.contains('on')?close():open(); } });
})();
</script>
</body>
</html>
