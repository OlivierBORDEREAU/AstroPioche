<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05030f">
<title>ASTRO PIOCHE Remake</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
  :root{--cy:#39f3ff;--mg:#ff3fd8;--gold:#ffd84a;--ui:ui-monospace,Menlo,Consolas,monospace}
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:var(--ui);color:#e8f6ff;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{position:fixed;inset:0}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* ---------- HUD ---------- */
  /* bloc HUD en flux : la barre se place toujours sous le texte, quelle que soit la police / l'encoche */
  :root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
  #hudTop{position:absolute;z-index:5;top:calc(8px + var(--sat));left:calc(62px + var(--sal));right:calc(104px + var(--sar));
    display:flex;flex-direction:column;align-items:stretch;pointer-events:none}
  #hud{display:flex;gap:14px;align-items:flex-start;text-shadow:0 0 6px rgba(57,243,255,.7)}
  .hb{display:flex;flex-direction:column;gap:2px;min-width:0}
  .lab{font-size:10px;line-height:12px;white-space:nowrap;letter-spacing:.12em;color:#8fd8ff;opacity:.8}
  .val{font-size:19px;line-height:22px;white-space:nowrap;font-weight:800;color:#fff;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .sm{font-size:10px;line-height:13px;white-space:nowrap;color:var(--gold);text-shadow:0 0 5px rgba(255,216,74,.6);letter-spacing:.06em}
  #hLives{display:flex;gap:3px;height:16px;align-items:center}
  #hLives i{display:block;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px var(--cy),inset 3px -2px 0 1px var(--cy)}
  #hLives b{font-size:12px;color:#fff}
  #hCnt{line-height:14px;height:14px;white-space:nowrap}
  #hCry{font-size:12px;line-height:14px;color:var(--cy);font-weight:700}
  #hShield{color:#9f9;font-size:12px;line-height:14px;font-variant-emoji:text;font-weight:700}
  #zbar{position:relative;flex:0 0 auto;margin-top:7px;max-width:420px;height:13px;box-sizing:border-box;border-radius:7px;border:1px solid rgba(255,216,74,.55);
    background:rgba(20,10,40,.45);overflow:visible;box-shadow:0 0 8px rgba(255,176,32,.25)}
  #zfill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ff7a18,#ffd84a);box-shadow:0 0 10px #ffb020;transition:width .25s}
  #zbar.ready #zfill{background:linear-gradient(90deg,#39f3ff,#b6ffea);animation:rdy .5s infinite alternate}
  @keyframes rdy{to{filter:brightness(1.6)}}
  #ztxt{position:absolute;right:6px;top:0;font-size:9px;line-height:11px;white-space:nowrap;color:#fff;text-shadow:0 0 3px #000}
  #combo{margin-top:4px;line-height:20px;height:20px;white-space:nowrap;
    font-weight:900;font-size:16px;color:var(--mg);text-shadow:0 0 10px var(--mg);opacity:0;transition:opacity .2s;font-style:italic}
  #combo.on{opacity:1}
  #topBtns{position:absolute;z-index:6;top:calc(8px + var(--sat));right:calc(8px + var(--sar));display:flex;gap:8px}
  .rb{width:44px;height:44px;padding:0;border-radius:10px;border:2px solid rgba(57,243,255,.65);background:rgba(10,8,30,.55);color:var(--cy);
    display:flex;align-items:center;justify-content:center;opacity:.75;touch-action:manipulation;cursor:pointer;box-shadow:0 0 8px rgba(57,243,255,.3)}
  .rb:active,.rb:hover{opacity:1}
  .rb svg{width:22px;height:22px}
  /* ---------- bandeau ---------- */
  #banner{position:absolute;z-index:7;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;
    font-weight:900;font-style:italic;font-size:clamp(22px,7vw,46px);letter-spacing:.06em;color:#fff;
    text-shadow:0 0 8px var(--mg),0 0 22px var(--mg),0 0 40px #7a3cff}
  #banner small{display:block;font-size:.42em;letter-spacing:.2em;color:var(--cy);text-shadow:0 0 8px var(--cy);margin-top:6px;font-style:normal}
  #banner.show{animation:ban 2.1s ease-out forwards}
  @keyframes ban{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96) translateY(-12px)}}
  /* ---------- commandes tactiles ---------- */
  #ctl{display:none}
  html.touch #ctl{display:block}
  .tb{position:absolute;z-index:8;width:76px;height:76px;border-radius:50%;box-sizing:border-box;
    border:2px solid rgba(57,243,255,.6);background:rgba(16,8,44,.42);box-shadow:0 0 14px rgba(57,243,255,.3),inset 0 0 14px rgba(57,243,255,.18);
    display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;color:#bff;font-size:9px;font-weight:800;letter-spacing:.08em}
  .tb svg{width:30px;height:30px}
  .tb.on{background:rgba(57,243,255,.32);transform:scale(.93);box-shadow:0 0 22px rgba(57,243,255,.7),inset 0 0 18px rgba(57,243,255,.4)}
  #tL{left:calc(12px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
  #tR{left:calc(98px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
  #tDig{right:calc(12px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));border-color:rgba(255,176,32,.75);color:#ffd27a;
    box-shadow:0 0 14px rgba(255,176,32,.35),inset 0 0 14px rgba(255,176,32,.2)}
  #tDig.on{background:rgba(255,176,32,.32);box-shadow:0 0 22px rgba(255,176,32,.8)}
  #tFire{right:calc(98px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));border-color:rgba(255,63,216,.75);color:#ffb3f0;
    box-shadow:0 0 14px rgba(255,63,216,.35),inset 0 0 14px rgba(255,63,216,.2)}
  #tFire.on{background:rgba(255,63,216,.32);box-shadow:0 0 22px rgba(255,63,216,.8)}
  #tJump{width:60px;height:60px;right:calc(64px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom))}
  #tJump svg{width:24px;height:24px}
  /* ---------- écrans ---------- */
  .ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;
    padding:calc(58px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background:radial-gradient(ellipse at 50% 45%,rgba(12,4,34,.35),rgba(0,0,0,.72));overflow:auto}
  .ov.on{display:flex}
  .logo{margin:0;font-weight:900;font-style:italic;letter-spacing:.06em;line-height:.95;font-size:clamp(40px,13vw,86px);
    background:linear-gradient(180deg,#fff 0%,#ffe9a0 30%,#ff3fd8 62%,#7a3cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,63,216,.75)) drop-shadow(0 0 2px #fff)}
  .tag{margin:10px 0 18px;letter-spacing:.42em;font-size:13px;color:var(--cy);text-shadow:0 0 8px var(--cy)}
  .help{font-size:12px;line-height:1.7;color:#cfe;max-width:440px;margin:0 0 18px;opacity:.9}
  .help b{color:var(--gold)}
  .nb{font:inherit;font-size:18px;font-weight:900;letter-spacing:.14em;color:#fff;padding:14px 34px;border-radius:12px;cursor:pointer;
    border:2px solid var(--cy);background:rgba(57,243,255,.12);box-shadow:0 0 16px rgba(57,243,255,.5),inset 0 0 12px rgba(57,243,255,.25);
    text-shadow:0 0 8px var(--cy);touch-action:manipulation;animation:pulse 1.2s ease-in-out infinite alternate}
  @keyframes pulse{to{box-shadow:0 0 28px rgba(57,243,255,.85),inset 0 0 16px rgba(57,243,255,.4)}}
  .rec{margin-top:16px;font-size:12px;color:var(--gold);letter-spacing:.15em;text-shadow:0 0 6px rgba(255,216,74,.6)}
  h2.t{margin:0 0 6px;font-size:clamp(24px,7vw,40px);font-style:italic;font-weight:900;color:#fff;text-shadow:0 0 10px var(--mg),0 0 26px var(--mg)}
  .sub{font-size:13px;color:#cfe;margin:0 0 14px;line-height:1.6}
  .sub b{color:var(--gold)}
  #cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0 16px;max-width:640px}
  .card{font:inherit;width:190px;padding:12px 10px;border-radius:12px;border:2px solid rgba(57,243,255,.6);background:rgba(10,20,40,.6);color:#e8f6ff;cursor:pointer;
    text-align:left;box-shadow:0 0 12px rgba(57,243,255,.25);touch-action:manipulation}
  .card h3{margin:0 0 4px;font-size:15px;color:var(--cy);letter-spacing:.08em}
  .card p{margin:0 0 8px;font-size:11px;line-height:1.4;color:#bcd}
  .card .lv{font-size:12px;color:var(--gold);letter-spacing:.2em}
  .card .cost{float:right;font-weight:800;color:#fff}
  .card.no{opacity:.4}
  .card.max .cost{color:#9f9}
  .card .k{font-size:9px;color:#789;margin-left:4px}
  @media (max-width:430px){.card{width:100%;max-width:330px;padding:9px 10px}.card p{margin-bottom:4px}}
  #pauseOv{background:rgba(0,0,0,.55)}
  html.touch body:not(.playing) #ctl,html.touch body.menu #ctl{display:none}
  #zbar.ready #ztxt{color:#022;text-shadow:none;font-weight:800}
  body:not(.playing) #hudTop,body:not(.playing) #bPause{visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudTop">
<div id="hud">
  <div class="hb"><div class="lab">SCORE</div><div id="hScore" class="val">0</div><div id="hHi" class="sm">RECORD 0</div></div>
  <div class="hb"><div class="lab">NIVEAU</div><div id="hLvl" class="val">1</div></div>
  <div class="hb"><div class="lab">VIES</div><div id="hLives"></div><div id="hCnt"><span id="hCry">◆ 0</span> <span id="hShield"></span></div></div>
</div>
<div id="zbar"><div id="zfill"></div><span id="ztxt">0/10</span></div>
<div id="combo"></div>
</div>
<div id="topBtns">
  <button class="rb" id="bMute" aria-label="Son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".25"/><path id="mWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path id="mX" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button>
  <button class="rb" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
</div>
<div id="banner"></div>
<div id="ctl">
  <div class="tb" id="tL" aria-label="gauche"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 4L6 12l10 8z"/></svg></div>
  <div class="tb" id="tR" aria-label="droite"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 4l10 8-10 8z"/></svg></div>
  <div class="tb" id="tJump" aria-label="saut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14l7-7 7 7M8 20l4-4 4 4"/></svg>SAUT</div>
  <div class="tb" id="tFire" aria-label="feu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>FEU</div>
  <div class="tb" id="tDig" aria-label="creuser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7c5-4 11-4 16 0"/><path d="M11 5.5L20 21"/></svg>CREUSER</div>
</div>

<div class="ov on" id="titleOv">
  <h1 class="logo">ASTRO<br>PIOCHE</h1>
  <div class="tag">REMAKE</div>
  <p class="help" id="helpTxt"></p>
  <button class="nb" id="bPlay">JOUER</button>
  <div class="rec" id="tRec">RECORD 0</div>
</div>
<div class="ov" id="shopOv">
  <h2 class="t" id="shopT">NIVEAU TERMINÉ !</h2>
  <p class="sub" id="shopSub"></p>
  <div id="cards"></div>
  <button class="nb" id="bGo">DÉCOLLER ▶</button>
</div>
<div class="ov" id="overOv">
  <h2 class="t">PARTIE TERMINÉE</h2>
  <p class="sub" id="overSub"></p>
  <button class="nb" id="bAgain">REJOUER</button>
</div>
<div class="ov" id="pauseOv">
  <h2 class="t">PAUSE</h2>
  <p class="sub">Touche l'écran ou appuie sur <b>P</b> pour reprendre</p>
  <button class="nb" id="bResume">REPRENDRE</button>
</div>
<script>
"use strict";
/* =====================================================================
   ASTRO PIOCHE Remake
   Même boucle que l'original : creuser les zones qui clignotent, tirer
   sur les météorites, toucher la soucoupe (vie bonus, 3 max), puis rejoindre la
   fusée. Habillage néon / vectoriel sur Canvas 2D, son 100 % WebAudio.
   ===================================================================== */
var paused = false;                 // utilisé aussi par le bouton accueil
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const adiff = (a, b) => wrapA(a - b);
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = id => document.getElementById(id);
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (IS_TOUCH) document.documentElement.classList.add('touch');
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* ---------- stockage ---------- */
const LS_HI = 'astroPiocheModerneHi', LS_MUTE = 'astroPiocheModerneMute';
let HI = 0, muted = false;
try { HI = +localStorage.getItem(LS_HI) || 0; muted = localStorage.getItem(LS_MUTE) === '1'; } catch (e) {}

/* =====================================================================
   SON : synthwave générée + bruitages
   ===================================================================== */
const BPM = 108, S16 = 60 / BPM / 4;
let ac = null, master, musBus, musLP, padLP, dly, sfxBus, noiseB;
let mStep = 0, mNext = 0, intensity = 0.12, intensityT = 0.12;
const CH = [ // Am - F - C - G
  { root: 45, pad: [57, 60, 64] }, { root: 41, pad: [57, 60, 65] },
  { root: 48, pad: [55, 60, 64] }, { root: 43, pad: [55, 59, 62] }];
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function initAudio() {
  if (ac) { if (ac.state !== 'running') ac.resume(); return; }
  const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  try { ac = new A(); } catch (e) { ac = null; return; }
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ac.destination);
  musBus = ac.createGain(); musBus.gain.value = 0.42;
  musLP = ac.createBiquadFilter(); musLP.type = 'lowpass'; musLP.frequency.value = 900; musLP.Q.value = 0.8;
  musBus.connect(musLP); musLP.connect(master);
  padLP = ac.createBiquadFilter(); padLP.type = 'lowpass'; padLP.frequency.value = 1500; padLP.connect(musBus);
  dly = ac.createDelay(1); dly.delayTime.value = S16 * 3;
  const fb = ac.createGain(); fb.gain.value = 0.33; const dlf = ac.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 1800;
  dly.connect(dlf); dlf.connect(fb); fb.connect(dly); dlf.connect(musBus);
  sfxBus = ac.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
  noiseB = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0); // déverrouillage iOS
  mNext = ac.currentTime + 0.1;
  setInterval(sched, 25);
}
function env(g, t, vol, a, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(type, f0, f1, t, dur, vol, dest, a = 0.005, det = 0) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  if (det) o.detune.value = det; env(g, t, vol, a, dur); o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + dur + 0.05); return g;
}
function noise(t, dur, vol, ftype, f0, f1, dest, q = 1, a = 0.004) {
  const s = ac.createBufferSource(); s.buffer = noiseB; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain(); env(g, t, vol, a, dur); s.connect(f); f.connect(g); g.connect(dest || sfxBus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05); return g;
}
function sched() {
  if (!ac || ac.state !== 'running') return;
  if (mNext < ac.currentTime - 0.25) mNext = ac.currentTime + 0.05;
  while (mNext < ac.currentTime + 0.12) { if (!paused && !document.hidden) mstep(mStep, mNext); mNext += S16; mStep++; }
}
function mstep(s, t) {
  const bar = Math.floor(s / 16) % 4, i = s % 16, ch = CH[bar], I = intensity;
  if (i === 0) for (const n of ch.pad) for (const det of [-9, 9]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mf(n); o.detune.value = det;
    const dur = S16 * 16; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.35);
    g.gain.setValueAtTime(0.05, t + dur - 0.2); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.3);
    o.connect(g); g.connect(padLP); o.start(t); o.stop(t + dur + 0.35);
  }
  if (i % 2 === 0) { // basse "pulsée" en croches
    const n = ch.root + ((i % 4 === 2 && I > 0.4) ? 12 : 0);
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mf(n);
    f.type = 'lowpass'; f.Q.value = 6; f.frequency.setValueAtTime(400 + I * 1800, t); f.frequency.exponentialRampToValueAtTime(140, t + S16 * 1.8);
    env(g, t, 0.22, 0.004, S16 * 1.9); o.connect(f); f.connect(g); g.connect(musBus); o.start(t); o.stop(t + S16 * 2);
  }
  if (I > 0.18 && i % 4 === 0) { tone('sine', 150, 42, t, 0.28, 0.75, musBus); }
  if (I > 0.45 && (i === 4 || i === 12)) { noise(t, 0.18, 0.32, 'bandpass', 1900, 1200, musBus, 0.8); tone('triangle', 200, 120, t, 0.1, 0.2, musBus); const g = noise(t, 0.3, 0.12, 'bandpass', 2400, 2400, dly, 1); }
  if (I > 0.28 && i % 4 === 2) noise(t, 0.05, 0.14, 'highpass', 7500, 7500, musBus, 0.7);
  if (I > 0.72 && i % 2 === 1) noise(t, 0.03, 0.07, 'highpass', 9000, 9000, musBus, 0.7);
  if (I > 0.55) { // arpège
    const seq = [0, 1, 2, 1, 0, 2, 1, 2], n = ch.pad[seq[i % 8]] + 12 + (i >= 8 ? 12 : 0);
    const g = tone('square', mf(n), 0, t, S16 * 0.9, 0.045, musBus, 0.004); g.connect(dly);
  }
  if (I > 0.85 && i % 8 === 0) { const g = tone('sawtooth', mf(ch.pad[2] + 24), 0, t, S16 * 6, 0.04, musBus, 0.05, 6); g.connect(dly); }
}
function setIntensity(dt) {
  intensity += (intensityT - intensity) * Math.min(1, dt * 1.5);
  if (ac) musLP.frequency.setTargetAtTime(500 + intensity * intensity * 9000, ac.currentTime, 0.2);
}

  shoot() { const t = ac.currentTime; tone('square', 1200, 260, t, 0.09, 0.09); tone('sawtooth', 600, 140, t, 0.07, 0.05); },

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const t of texts) {
    let [x, y] = w2s(t.x, t.y); y -= t.t * 42;
    const a = 1 - Math.max(0, (t.t - 0.75) / 0.45), sc = t.t < 0.12 ? 1 + (0.12 - t.t) * 5 : 1;
    ctx.globalAlpha = a; ctx.font = `italic 900 ${Math.round((t.big ? 17 : 14) * sc)}px ui-monospace,Menlo,monospace`;
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 4; ctx.strokeText(t.txt, x, y);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, x, y);
  }
  ctx.globalAlpha = 1;
}
function drawIndicators() {
  if (G.state !== 'play' && G.state !== 'intro') return;
  const list = zones.map(z => [z.a, z.rare ? '#39f3ff' : '#ffb020', '']);
  if (G.rocketReady) list.push([0, '#50ff8c', 'FUSÉE']);
  if (capsule) list.push([capsule.a, '#8f8', 'VIE']);
  for (const o of ores) list.push([o.a, '#39f3ff', '◆']);
  ctx.font = '800 10px ui-monospace,Menlo,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // rocher en approche : gros avertissement rouge au ras du sol, côté d'où il arrive
  for (const b of boulders) {
    const [x, y] = w2s(...pt(b.a, surf(b.a) + b.r));
    if (b.warn <= 0 && x > 0 && x < W) continue;
    const side = -b.dir, gy = w2s(...pt(P.a + side * 0.9, surf(P.a + side * 0.9) + 14))[1];
    const ix = side < 0 ? 26 : W - 26, iy = clamp(Math.min(gy, y), 120, H - 150), bl = Math.sin(gt * 16) > 0 ? 1 : 0.45;
    ctx.globalAlpha = bl; ctx.fillStyle = '#ff4a3a';
    ctx.beginPath(); ctx.moveTo(ix - side * 14, iy); ctx.lineTo(ix + side * 4, iy - 13); ctx.lineTo(ix + side * 4, iy + 13); ctx.closePath(); ctx.fill();
    ctx.font = '900 12px ui-monospace,Menlo,monospace'; ctx.textAlign = side < 0 ? 'left' : 'right'; ctx.fillText('! SAUTE', side < 0 ? 8 : W - 8, iy - 22); ctx.textAlign = 'center';
    ctx.font = '800 10px ui-monospace,Menlo,monospace';
  }
  ctx.globalAlpha = 1;
  for (const [a, col, lab] of list) {
    const [x, y] = w2s(...pt(a, surf(a) + 25));
    if (x > 18 && x < W - 18 && y < H - 20) continue;
    const side = adiff(a, cam) < 0 ? -1 : 1, ix = side < 0 ? 20 : W - 20, iy = clamp(y, 130, H - 150);
    const p = 0.6 + 0.4 * Math.sin(gt * 7);
    ctx.globalAlpha = p; ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(ix + side * 10, iy); ctx.lineTo(ix - side * 4, iy - 10); ctx.lineTo(ix - side * 4, iy + 10); ctx.closePath(); ctx.fill();
    if (lab) ctx.fillText(lab, ix - side * 6, iy - 18);
  }
  ctx.globalAlpha = 1;
}

/* =====================================================================
   INTERFACE
   ===================================================================== */
const OVS = ['titleOv', 'shopOv', 'overOv', 'pauseOv'];
function showOv(id) {
  for (const o of OVS) $(o).classList.toggle('on', o === id);
  document.body.classList.toggle('playing', G.state !== 'title');
  document.body.classList.toggle('menu', !!id);
}
let hudC = {};
function hset(id, v, html) { if (hudC[id] === v) return; hudC[id] = v; html ? ($(id).innerHTML = v) : ($(id).textContent = v); }
function hud(force) {
  if (force) hudC = {};
  hset('hScore', String(G.score)); hset('hHi', 'RECORD ' + Math.max(HI, G.score)); hset('hLvl', String(G.level));
  hset('hLives', G.lives <= 5 ? '<i></i>'.repeat(Math.max(0, G.lives)) : '<i></i><b>×' + G.lives + '</b>', true);
  hset('hCry', '◆ ' + G.cry); hset('hShield', G.shield > 0 ? '⛨' + G.shield : '');
  const zd = G.zonesDone || 0, tg = G.target || 10;
  hset('ztxt', G.rocketReady ? 'FUSÉE PRÊTE !' : zd + '/' + tg);
  $('zfill').style.width = Math.min(100, zd / tg * 100) + '%'; $('zbar').classList.toggle('ready', !!G.rocketReady);
  hset('combo', G.combo > 1 ? 'COMBO x' + G.combo : ''); $('combo').classList.toggle('on', G.combo > 1);
}
const UPG = [
  { id: 'pick', name: 'PIOCHE', desc: 'Creuse plus vite (+30 % par niveau).', key: '1' },
  { id: 'blast', name: 'BLASTER', desc: 'Cadence accrue. Tir double au niv. 2, triple au niv. 4.', key: '2' },
  { id: 'shield', name: 'BOUCLIER', desc: 'Encaisse une météorite à ta place (2 max).', key: '3' },
];
function upCost(id) { if (id === 'shield') return G.shield >= 2 ? null : 5; const l = G.up[id]; return l >= 4 ? null : COST[l]; }
function renderShop() {
  $('cards').innerHTML = UPG.map(u => {
    const c = upCost(u.id), lvl = u.id === 'shield' ? G.shield : G.up[u.id], mx = u.id === 'shield' ? 2 : 4;
    const dots = '●'.repeat(lvl) + '○'.repeat(mx - lvl);
    return `<button class="card ${c === null ? 'max' : c > G.cry ? 'no' : ''}" data-u="${u.id}"><span class="cost">${c === null ? 'MAX' : '◆ ' + c}</span><h3>${u.name}<span class="k">[${u.key}]</span></h3><p>${u.desc}</p><div class="lv">${dots}</div></button>`;
  }).join('');
  const s = $('sCry'); if (s) s.textContent = G.cry;
}
function buy(id) {
  const c = upCost(id);
  if (c === null || c > G.cry) { sfx('nope'); return; }
  G.cry -= c; if (id === 'shield') G.shield++; else G.up[id]++;
  sfx('buy'); buzz(20); renderShop(); hud();
}
$('cards').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) buy(b.dataset.u); });
function nextLevel() { if (G.state !== 'shop') return; G.level++; showOv(null); startLevel(); showOv(null); }
function startGame() { initAudio(); newGame(); showOv(null); }
let userPause = false;
function setPause(p) {
  if (p && !['play', 'intro', 'dead', 'launch'].includes(G.state)) return;
  if (homeOpen()) return;
  userPause = p; paused = p; showOv(p ? 'pauseOv' : null);
}
function homeOpen() { const d = $('homeDlg'); return d && d.classList.contains('on'); }
$('bPlay').addEventListener('click', startGame);
$('bAgain').addEventListener('click', () => { if (gt - (G.overT || 0) > 0.6) startGame(); });
$('bGo').addEventListener('click', nextLevel);
$('bPause').addEventListener('click', () => { initAudio(); setPause(!userPause); });
$('bResume').addEventListener('click', () => setPause(false));
$('bMute').addEventListener('click', () => { initAudio(); setMute(!muted); });
$('helpTxt').innerHTML = IS_TOUCH
  ? '<b>◀ ▶</b> marcher · <b>CREUSER</b> les zones lumineuses<br><b>FEU</b> vise tout seul · <b>SAUT</b> = jetpack<br>Saute rochers et fissures, attrape le ◆ volant<br>Enchaîne les <b>combos</b>, ramasse le minerai ◆,<br>abats la soucoupe pour une vie (3 max),<br>puis file à la fusée !'
  : '<b>← →</b> ou <b>Q D</b> marcher · <b>↓</b> ou <b>S</b> creuser · <b>Espace</b> tirer<br><b>↑</b> ou <b>Z</b> jetpack · <b>P</b> pause · <b>M</b> son · <b>Échap</b> accueil<br>Saute les rochers et fissures, attrape le minerai ◆ en orbite<br>Creuse vite pour enchaîner les <b>combos</b>, ramasse le minerai rare ◆,<br>touche la soucoupe pour une vie (3 max),<br>puis rejoins la fusée !';
$('tRec').textContent = 'RECORD ' + HI;
setMute(muted);

/* ---------- clavier ---------- */
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat && keys[e.code]) return;
  keys[e.code] = true; initAudio();
  if (homeOpen()) return;
  const go = e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter';
  if (G.state === 'title' && go) startGame();
  else if (G.state === 'over' && go && gt - G.overT > 0.8) startGame();
  else if (G.state === 'shop') { if (e.code === 'Digit1' || e.code === 'Numpad1') buy('pick'); else if (e.code === 'Digit2' || e.code === 'Numpad2') buy('blast'); else if (e.code === 'Digit3' || e.code === 'Numpad3') buy('shield'); else if (e.code === 'Enter' || e.code === 'NumpadEnter') nextLevel(); }
  else if (e.code === 'KeyP') setPause(!userPause);
  else if (userPause && go) setPause(false);
  if (e.code === 'KeyM') setMute(!muted);

addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const kk in keys) keys[kk] = false; for (const kk in tb) tb[kk] = 0; });

/* ---------- tactile (multi-touch) ---------- */
function interactive(t) { return t && t.closest && t.closest('button,a,#homeDlg,#homeBtn'); }
function updTouch(e) {
  const st = { l: 0, r: 0, dig: 0, fire: 0, jump: 0 };

    const rects = Object.keys(tbEls).map(kk => [kk, tbEls[kk].getBoundingClientRect()]);
    for (const t of e.touches) {
      let best = null, bd = 1e9;

      if (best) st[best] = 1;

  }
  for (const kk in st) { if (tb[kk] !== st[kk]) { tb[kk] = st[kk]; tbEls[kk].classList.toggle('on', !!st[kk]); if (st[kk]) buzz(6); } }

const opt = { passive: false };
addEventListener('touchstart', e => { if (interactive(e.target)) return; updTouch(e); if (e.cancelable) e.preventDefault(); }, opt);

  else if (userPause) setPause(false);
}, opt);
addEventListener('touchcancel', updTouch, opt);
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveHi(); setPause(true); } });

/* ---------- boucle ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; gt += dt;
  if (!paused) { trauma = Math.max(0, trauma - dt * 1.7); if (hitStop > 0) hitStop -= dt; else update(dt); }
  if (!paused && userPause) { userPause = false; showOv(null); }
  setIntensity(dt);
  render();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));
genLevel(1, 1234); resize(); cam = 0.3;
hud(true);
requestAnimationFrame(frame);
window.__astro = { get G() { return G; }, get P() { return P; }, get zones() { return zones; }, get meteors() { return meteors; }, get parts() { return parts; }, get bullets() { return bullets; }, get saucer() { return saucer; }, set saucer(v) { saucer = v; }, get capsule() { return capsule; }, get boulders() { return boulders; }, get fissures() { return fissures; }, get ores() { return ores; }, spawnBoulder, spawnFissure, spawnOre, spawnMeteor };
</script>
